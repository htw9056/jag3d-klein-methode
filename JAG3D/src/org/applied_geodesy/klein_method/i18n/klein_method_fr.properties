# de: Ein (Standard): Startwerte der Höhe zuerst aus Nivellement, dann aus trigonometrischen Höhen, GNSS-Höhen nur\nfür Punkte, die sonst keine Höhe bekommen; Startwerte der Lage zuerst terrestrisch, dann GNSS.\nIn der Höhe zählen wiederholte GNSS-Sessions zwischen denselben Punkten zusammen wie eine Basislinie,\nund die GNSS-Höhe bekommt die 3-fache Lageunsicherheit - viele Sessions überstimmen so nicht die terrestrischen Höhen.\nAus: alle Beobachtungsarten gleichrangig (wie bis V0.417).
kb4401ec6=Activé (par défaut) : valeurs initiales d'altitude d'abord issues du nivellement, puis des hauteurs trigonométriques, hauteurs GNSS seulement\npour les points qui n'obtiennent pas d'altitude autrement ; valeurs initiales de position d'abord terrestres, puis GNSS.\nEn altitude, les sessions GNSS répétées entre les mêmes points comptent ensemble comme une seule ligne de base,\net la hauteur GNSS reçoit 3 fois l'incertitude de position - ainsi de nombreuses sessions ne l'emportent pas sur les hauteurs terrestres.\nDésactivé : tous les types d'observations à égalité (comme jusqu'à V0.417).
