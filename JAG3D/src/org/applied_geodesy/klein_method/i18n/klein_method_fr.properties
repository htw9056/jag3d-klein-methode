# de: Wirkt nur bei GNSS-Basislinien im Verteilungsmodus „prozentual“:\n1. „gedämpfter Achs Split“ (Empfehlung): Korrektur nach den Achsen X/Y/Z aufgeteilt (Anteil je Achse aus dem EP), gedämpft - im Vergleich stabil und zeigt die schwächere GNSS-Höhe.\n2. „Lage/Höhe-Split“: Korrektur nach Lage (horizontal) und Höhe (Lotrichtung) aufgeteilt, gedämpft; die Lotrichtung wird je Basislinie aus den ausgeglichenen Koordinaten bestimmt - am stabilsten, unterscheidet Höhe/Lage aber kaum.\n3. „einfache Anpassung“: sigma_neu = sigma_alt + sigma_alt*log10(F), alle Achsen gleich - am unruhigsten.\nIm Modus „normal“ gilt immer die einfache Anpassung.
kaf9504e2=N'agit que pour les lignes de base GNSS en mode de répartition « pourcentage » :\n1. « split d'axes amorti » (recommandation) : correction répartie selon les axes X/Y/Z (part par axe issue de l'EP), amortie - comparativement stable et met en évidence la composante altimétrique GNSS plus faible.\n2. « split position/hauteur » : correction répartie selon la position (horizontale) et la hauteur (direction de la verticale), amortie ; la direction de la verticale est déterminée par ligne de base à partir des coordonnées compensées - le plus stable, mais distingue à peine hauteur/position.\n3. « ajustement simple » : sigma_neu = sigma_alt + sigma_alt*log10(F), tous les axes de façon identique - le plus instable.\nEn mode « normal », c'est toujours l'ajustement simple qui s'applique.
