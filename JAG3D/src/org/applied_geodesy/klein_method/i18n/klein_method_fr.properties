# de: Nur dynamische Ausgleichung: Welche beweglichen Anschlusspunkte können künftig als Festpunkte dienen?\nBewertet wird je Punkt die kalibrierte individuelle Unsicherheit (eine Zahl für y/x/z) in Ampelfarben:\nRandpunkte (Endbereiche, äußere Umrandung, Anschlussbereiche) mit den Rand-Grenzen, Stützpunkte in der Mitte mit den Mitte-Grenzen;\n1D-Punkte (Nivellement) jeweils mit der Höhen-, 2D/3D-Punkte mit der Lage-Grenze.\nDanach wird die Verteilung der grünen Festpunkte geprüft: langgestreckte Netze auf Lücken und Enden,\nflächige Netze darauf, dass alle Neupunkte innerhalb der Festpunkte liegen.\nEs ist eine Empfehlung - im Zweifel entscheidet der Anwender.
k6f607944=Uniquement compensation dynamique : quels points de rattachement mobiles peuvent servir à l'avenir de points d'appui ?\nPour chaque point, l'incertitude individuelle calibrée (une valeur pour y/x/z) est évaluée en couleurs de feu tricolore :\npoints de bordure (zones d'extrémité, contour extérieur, zones de rattachement) avec les seuils de bordure, points de soutien au milieu avec les seuils du milieu ;\npoints 1D (nivellement) avec le seuil d'altitude, points 2D/3D avec le seuil de position.\nEnsuite, la répartition des points d'appui verts est vérifiée : pour les réseaux allongés, les lacunes et les extrémités,\npour les réseaux surfaciques, que tous les points nouveaux se situent à l'intérieur des points d'appui.\nIl s'agit d'une recommandation - en cas de doute, c'est l'utilisateur qui décide.
