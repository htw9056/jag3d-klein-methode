# de: Direkt aufeinanderfolgende Messungen desselben Standpunkts und Ziels (GNSS: Epochen einer Sitzung, Lasertracker: Messreihen auf einen Punkt) sind nicht unabhängig. Als einzelne Beobachtungen wiegen sie etwa Wurzel(n)-fach zu schwer und drängen die übrigen Messungen an den Rand.\n\nZusammenfassen: je Wiederholungsgruppe ein Mittel, die Einzelwerte werden deaktiviert (nicht gelöscht); Genauigkeit mindestens die Streuung der Gruppe.\nSprünge und Drift innerhalb einer Gruppe werden vorher geprüft. Rücknahme jederzeit über Menü Klein_Method.\n\n
k3e18b639=Des mesures directement consécutives depuis la même station vers la même cible (GNSS : époques d'une session, laser tracker : séries sur un point) ne sont pas indépendantes. Comme observations isolées, elles pèsent environ sqrt(n) fois trop et repoussent les autres mesures.\n\nFusionner : une moyenne par groupe de répétition, les valeurs isolées sont désactivées (non supprimées) ; précision au moins la dispersion du groupe.\nLes sauts et dérives d'un groupe sont contrôlés au préalable. Annulation à tout moment via le menu Klein_Method.\n\n
# de: Grenze grober Fehler als lineare Abweichung einer Beobachtung in Metern (Standard 0,10 m).\nEinziges Kriterium - kein logPost oder anderer statistischer Wert:\n• Sperre nach F5: liegt eine Beobachtung darüber, ist nur „Grobe Fehler bereinigen“ aktiv.\n• Bereinigung: nimmt schrittweise die größte Abweichung heraus, bis keine mehr darüber liegt.\n• Fenster: bis zu diesem Wert grün (hält die Ausgleichung aus, wieder aufnehmen), darüber rot (grober Fehler).\nLineare Abweichung = geschätzter grober Fehler aus JAG3D; Richtung/Zenitwinkel mal Strecke, GNSS als 3D-Länge.\nKaum kontrollierte Beobachtungen (Redundanzanteil unter 5 %) sind nicht prüfbar und zählen nicht mit.\nErlaubt: 
k3e3dc535=Limite des fautes en tant qu'écart linéaire d'une observation, en mètres (standard 0,10 m).\nCritère unique - aucun logPost ni autre valeur statistique :\n• Verrouillage après F5 : si une observation la dépasse, seul « Éliminer les fautes » est actif.\n• Élimination : retire progressivement le plus grand écart, jusqu'à ce qu'aucun ne la dépasse plus.\n• Fenêtre : jusqu'à cette valeur, vert (tolérable pour la compensation, à réintégrer), au-delà, rouge (faute).\nÉcart linéaire = faute estimée par JAG3D ; direction/angle zénithal fois distance, GNSS en longueur 3D.\nLes observations à peine contrôlées (part de redondance sous 5 %) ne sont pas vérifiables et ne comptent pas.\nAutorisé : 
