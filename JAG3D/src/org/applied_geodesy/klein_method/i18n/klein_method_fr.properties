# de: Nur aktiv, wenn nach F5 grobe Fehler vermutet werden: eine Beobachtung weicht linear um mehr als\ndie „Grenze grober Fehler (m)“ ab (Standard 0,10 m) - dann ist „Klein_Method starten“ gesperrt, bis bereinigt ist.\nKein logPost oder anderer statistischer Wert, nur die lineare Abweichung in Metern.\n\nAblauf: die Beobachtung mit der größten linearen Abweichung wird vorübergehend deaktiviert und neu gerechnet, dann die nächste -\nbis keine mehr über der Grenze liegt (schrittweise, weil ein grober Fehler auch gesunde Nachbarn auffällig macht).\nDanach entscheidest du je Beobachtung: grober Fehler (bleibt für Phase 1 außen vor) oder kein grober Fehler (wieder aufnehmen).\nVor Phase 2 fragt Klein_Method nach, ob die groben Fehler wieder aufgenommen oder deaktiviert gelassen werden.\nNur freie und fixe Ausgleichung. Auch in der Karte verfügbar.
k90892722=Actif uniquement si des fautes sont suspectées après F5 : une observation s'écarte linéairement de plus\nque la « Limite des fautes (m) » (standard 0,10 m) - alors « Démarrer Klein_Method » est verrouillé jusqu'à l'élimination.\nAucun logPost ni autre valeur statistique, seulement l'écart linéaire en mètres.\n\nDéroulement : l'observation avec le plus grand écart linéaire est temporairement désactivée et recalculée, puis la suivante -\njusqu'à ce qu'aucune ne dépasse plus la limite (par étapes, car une faute rend aussi suspects des voisins sains).\nEnsuite, vous décidez pour chaque observation : faute (reste exclue pour la phase 1) ou pas de faute (réintégrer).\nAvant la phase 2, Klein_Method demande si les fautes doivent être réintégrées ou rester désactivées.\nUniquement compensation libre et contrainte. Également disponible dans la carte.
