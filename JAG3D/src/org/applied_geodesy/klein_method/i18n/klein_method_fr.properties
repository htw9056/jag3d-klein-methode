# de: Nur dynamische Ausgleichung: zeigt die Festpunkt-Empfehlung in der Karte.\nBewegliche Anschlusspunkte als Ring in Ampelfarbe (grün / gelb / rot, blau = bereits Festpunkt) mit ihrer Unsicherheit,\nbei langgestreckten Netzen die Achse (blau gestrichelt), bei flächigen die Umrandung der grünen Festpunkte,\nNeupunkte außerhalb der Festpunkte als rotes Kreuz. Ergebnis unten links.\nGrenzen und Abstände werden im Klein_Method-Tab eingestellt. Erneut klicken = ausblenden.
k40f6dded=Uniquement compensation dynamique : affiche la recommandation de points d'appui sur la carte.\nPoints de rattachement mobiles sous forme d'anneau en couleur de feu tricolore (vert / jaune / rouge, bleu = déjà point d'appui) avec leur incertitude,\npour les réseaux allongés l'axe (bleu en pointillés), pour les réseaux surfaciques le contour des points d'appui verts,\npoints nouveaux hors des points d'appui sous forme de croix rouge. Résultat en bas à gauche.\nLes seuils et distances se règlent dans l'onglet Klein_Method. Cliquer à nouveau = masquer.
