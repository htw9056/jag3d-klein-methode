# de: Nur dynamische und fixe AGL. Ein: Die 3D-Fest- bzw. Anschlusspunkte (GNSS, Tachymeter) bestimmen nur noch die Lage, ihre Höhe ist frei (σz = 10 m). Die Höhe kommt ausschließlich aus den Höhenfestpunkten (1D) über das Nivellement.\nDynamische AGL: die Festpunktanalyse bewertet bei 3D-Punkten nur die Lage. Fixe AGL: die varianzfreien 3D-Festpunkte kommen in eine eigene Gruppe, die in der Lage praktisch fest ist (σ 0,01 mm).\nVoraussetzung: Höhenfestpunkte im selben Höhensystem (NHN vorher mit dem Quasigeoid umrechnen), über Nivellement verbunden, empfohlen mindestens 3; in der fixen AGL mindestens einer varianzfrei.\nAus: alle Werte exakt wie vorher.
k14563907=Compensation dynamique et fixe uniquement. Activé : les points fixes/de rattachement 3D (GNSS, station totale) ne définissent plus que la position, leur hauteur est libre (σz = 10 m). La hauteur provient exclusivement des repères (1D) via le nivellement.\nCompensation dynamique : l'analyse des points fixes n'évalue que la position des points 3D. Compensation fixe : les points fixes 3D sans variance passent dans un groupe propre, pratiquement fixe en position (σ 0,01 mm).\nCondition : repères dans le même système d'altitude (convertir d'abord les altitudes NHN avec le quasi-géoïde), reliés par nivellement, au moins 3 recommandés ; en compensation fixe au moins un sans variance.\nDésactivé : toutes les valeurs exactement comme avant.
