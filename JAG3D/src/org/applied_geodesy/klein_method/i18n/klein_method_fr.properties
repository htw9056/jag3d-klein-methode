# de: Ein: je Punkt ein Messart-Symbol (Torte aus allen Messarten an diesem Punkt: GNSS violett, Strecke, Richtung, Zenitwinkel farbig) genau auf dem Punkt.\nAus (Standard): keine Messart-Symbole, nur Punkte und Linien.\nDer JAG3D-Netzplot zeichnet die Symbole ein Stück entlang jeder Linie; laufen viele Linien in dieselbe Richtung (z. B. zu fernen Referenzstationen), wirken sie dort wie eine verschobene Punktwolke - deshalb setzt die Karte sie auf den Punkt.\nNur Anzeige in der Karte - der Netzplot und seine Einstellungen bleiben unverändert.
k13d6ca9a=Activé : un symbole d’observation par point (camembert de tous les types d’observation en ce point : GNSS violet, distance, direction, angle zénithal en couleur) exactement sur le point.\nDésactivé (par défaut) : pas de symboles d’observation, seulement points et lignes.\nLe graphique de réseau JAG3D dessine les symboles un peu le long de chaque ligne ; si de nombreuses lignes vont dans la même direction (p. ex. vers des stations de référence éloignées), ils y ressemblent à un nuage de points décalé - la carte les place donc sur le point.\nAffichage sur la carte uniquement - le graphique de réseau et ses réglages restent inchangés.
