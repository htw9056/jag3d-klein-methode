# de: Koordinatensystem der Exportdatei. Angeboten werden nur Systeme, die sich aus dem Projektsystem mit eindeutigen Formeln umformen lassen (gleiches Datum ETRS89/WGS84, GRS80) - keine Datumstransformation, kein Geoidmodell.\nLokal (ENh) mit P0: geozentrisch, B/L/h und UTM 32/33 mit ellipsoidischer Höhe.\nGeozentrisch: B/L/h, UTM 32/33 und lokal (ENh) um P0.\nUTM mit Zonenkennung: B/L und die andere Zone, Höhe unverändert.\nGauß-Krüger mit Streifenkennung: wie UTM, wenn im Projektionsordner eine NTv2-Gitterdatei für das Gebiet liegt, sonst nur das Projektsystem.\nJede Gitterdatei (*.gsb) im Projektionsordner stellt ihre Systeme automatisch bereit (geographisch und Gauß-Krüger-Streifen, als „Transformation NTv2“ gekennzeichnet); dazu kommen eindeutige Definitionen aus dem Ordner (reine Umformungen ETRS89). 7-Parameter-Sätze werden nicht angeboten.
kbfa811d7=Système de coordonnées du fichier d'export. Seuls les systèmes déductibles du système du projet par des formules univoques sont proposés (même datum ETRS89/WGS84, GRS80) - pas de transformation de datum, pas de modèle de géoïde.\nLocal (ENh) avec P0 : géocentrique, B/L/h et UTM 32/33 avec hauteur ellipsoïdale.\nGéocentrique : B/L/h, UTM 32/33 et local (ENh) autour de P0.\nUTM avec numéro de zone : B/L et l'autre zone, hauteur inchangée.\nGauss-Krüger avec numéro de fuseau : comme UTM si le dossier des projections contient un fichier de grille NTv2 pour la zone, sinon système du projet uniquement.\nChaque fichier de grille (*.gsb) du dossier des projections fournit automatiquement ses systèmes (géographique et fuseaux Gauss-Krüger, marqués « transformation NTv2 ») ; en plus, les définitions univoques du dossier (conversions pures ETRS89). Les jeux à 7 paramètres ne sont pas proposés.
