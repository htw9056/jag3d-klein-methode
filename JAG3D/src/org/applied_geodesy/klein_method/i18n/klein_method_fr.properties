# de: Genauer als dieser Wert wird ein Festpunkt (beweglicher Anschlusspunkt) in der dynamischen AGL nicht angesetzt.\nIst ein Festpunkt mit den vorhandenen Messungen nicht prüfbar, würde seine Genauigkeit sonst bis fast null sinken:\ner wäre praktisch starr, und die Messungen (z. B. GNSS-Basislinien) hätten keinen Einfluss mehr auf ihn.\nLiegt ein Festpunkt am Ende an dieser Untergrenze, steht ein Hinweis im Protokoll.\nGilt nur, wenn das Projekt aktive GNSS-Basislinien hat - ohne GNSS gilt 0,01 mm (Lage und Höhe).\nStandard 1,0 mm, erlaubt 0,01 bis 50 mm.
kcf7f6922=En compensation dynamique, un point fixe (point de rattachement mobile) ne reçoit jamais une précision meilleure que cette valeur.\nSi un point fixe ne peut pas être contrôlé par les mesures disponibles, sa précision tomberait sinon presque à zéro :\nil serait pratiquement rigide et les mesures (p. ex. lignes de base GNSS) n’auraient plus d’influence sur lui.\nSi un point fixe se termine à cette limite inférieure, une remarque est écrite dans le protocole.\nS’applique uniquement si le projet contient des lignes de base GNSS actives - sans GNSS, 0,01 mm s’applique (position et altitude).\nPar défaut 1,0 mm, autorisé de 0,01 à 50 mm.
