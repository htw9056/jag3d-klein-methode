# de: Pendelt Max-logPost in der freien bzw. fixen Ausgleichung (Phase 2) sägezahnartig (in den letzten 4 Werten mindestens 2 Richtungswechsel),\nwird im Modus „normal“ nur die Hälfte des berechneten Schritts geschrieben: sigma_neu = sigma_alt + 0,5 · (sigma_formel − sigma_alt).\nGilt für GNSS im Modus „normal“ (auch während des Wächter-Wechsels) und für Richtungen, Strecken und Nivellement.\nVersuch – Standard aus. Wirkung im Protokoll: Zeile „DAEMPFUNG NORMAL“.
k3305e40a=Si Max-logPost oscille en dents de scie dans la compensation libre ou contrainte (phase 2) (au moins 2 changements de sens dans les 4 dernières valeurs),\nseule la moitié du pas calculé est écrite en mode « normal » : sigma_nouveau = sigma_ancien + 0,5 · (sigma_formule − sigma_ancien).\nS'applique au GNSS en mode « normal » (y compris pendant la bascule du surveillant) ainsi qu'aux directions, distances et nivellements.\nEssai – désactivé par défaut. Effet dans le protocole : ligne « DAEMPFUNG NORMAL ».
