# de: V0.353:\nDurchlauf 1 endet bei Max-logPost unter 2,45. Ist „Untergrenze erzwingen“ und/oder „Gruppen-σ nach DL 1“ eingeschaltet, werden die Werte dort zurückgesetzt und Durchlauf 2 startet.\nAb Durchlauf 2 beendet Max-logPost unter der „Abbruchgrenze ab DL 2“ (Standard 5,2) bzw. unter 2,45 die Berechnung (ohne weitere Untergrenzen-Erzwingung).\nEndet ein Durchlauf am Grenzwert Iterationen ohne 2,45, startet der nächste.\nAbbruchziel: Durchlauf 3 = bester Max-logPost aus Durchlauf 2 (nur unter 5,2), ab Durchlauf 4 = 5,2. Maximal 20 Durchläufe.
k7d40cde9=V0.353 :\nLe cycle 1 se termine lorsque Max-logPost est inférieur à 2,45. Si « Imposer la limite inférieure » et/ou « Groupe-σ après DL 1 » sont activés, les valeurs y sont réinitialisées et le cycle 2 démarre.\nÀ partir du cycle 2, le calcul se termine lorsque Max-logPost est inférieur à la « Limite d'arrêt à partir de DL 2 » (standard 5,2) ou inférieur à 2,45 (sans imposition supplémentaire de la limite inférieure).\nSi un cycle se termine à la limite d'itérations sans atteindre 2,45, le suivant démarre.\nObjectif d'arrêt : cycle 3 = meilleur Max-logPost du cycle 2 (uniquement en dessous de 5,2), à partir du cycle 4 = 5,2. Maximum 20 cycles.
