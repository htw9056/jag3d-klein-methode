# de: Längenabhängiger Zuschlag zur Grenze grober Fehler für GNSS-Basislinien: Grenze = Grenze grober Fehler + ppm × Länge.\nBeispiel 0,100 m + 2 ppm: 10 km → 0,120 m, 40 km → 0,180 m. Lange SAPOS-Basislinien werden so nicht wegen normaler Troposphären- und Höheneffekte abgeschaltet.\nStandard 2,0, erlaubt 0 bis 20, 0 = feste Grenze.
k5a89f658=Supplément dépendant de la longueur à la limite des fautes pour les lignes de base GNSS : limite = limite des fautes + ppm × longueur.\nExemple 0,100 m + 2 ppm : 10 km → 0,120 m, 40 km → 0,180 m. Les longues lignes de base SAPOS ne sont ainsi pas désactivées à cause d’effets normaux de troposphère et d’altitude.\nPar défaut 2,0, autorisé de 0 à 20, 0 = limite fixe.
