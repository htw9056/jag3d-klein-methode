# de: Schreibt Erfahrungswerte als Gruppenunsicherheit (Startwerte für Phase 1) - erst nach Vorschau und „Übernehmen“.\nDynamische Ausgleichung: Startwert je Dimension für alle beweglichen Anschlusspunkte (nur gleiche Festpunktart).\nNur Werte aus ANDEREN Projekten, die sich untereinander höchstens 10 % unterscheiden (Gruppe um den Median, mindestens 3 Projekte).\nAbweichende Projekte werden weggelassen und in der Vorschau genannt; ohne passende Gruppe bleibt der Wert unverändert.\nDeaktivierte Komponenten (0) bleiben 0, Untergrenzen werden eingehalten. Danach wird das Netz neu ausgeglichen.
k24af24c7=Écrit les valeurs empiriques comme incertitude de groupe (valeurs initiales pour la phase 1) - seulement après aperçu et « Appliquer ».\nCompensation dynamique : valeur initiale par dimension pour tous les points de rattachement mobiles (uniquement même type de point d'appui).\nSeulement des valeurs d'AUTRES projets qui diffèrent entre eux d'au plus 10 % (groupe autour de la médiane, au moins 3 projets).\nLes projets divergents sont écartés et mentionnés dans l'aperçu ; sans groupe correspondant, la valeur reste inchangée.\nLes composantes désactivées (0) restent à 0, les limites inférieures sont respectées. Le réseau est ensuite recompensé.
