# de: Beschleunigt die Einzelkalibrierung der Festpunkte (dynamische AGL, Phase 2), sobald die Hälfte fertig ist.\nNur beim Verkleinern. Bei Richtungswechsel 5 Schritte Pause, beim 2. Wechsel aus.\nSteht T_prio eines Punkts unter dem Band dreimal in Folge fast still, obwohl sigma verkleinert wird,\ngeht der Punkt direkt auf die Untergrenze – das gilt sofort, nicht erst ab der Hälfte.\nPhase 1 (Punktgruppen) rechnet immer ohne Turbo.
k3c2a51b4=Accélère la calibration individuelle des points d'appui (AGL dynamique, phase 2) dès que la moitié est terminée.\nUniquement lors de la diminution. En cas de changement de sens, pause de 5 pas, désactivé au 2e changement.\nSi le T_prio d'un point sous la bande reste presque immobile trois fois de suite alors que sigma diminue,\nle point passe directement à la limite inférieure – cela s'applique immédiatement, pas seulement à partir de la moitié.\nLa phase 1 (groupes de points) fonctionne toujours sans turbo.
