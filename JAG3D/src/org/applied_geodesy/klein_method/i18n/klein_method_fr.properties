# de: Erkennt sehr viele GNSS-Basislinien (z. B. Epochen alle 1-5 s über 30 min zu mehreren SAPOS-Stationen): mehr als 20 000 oder im Mittel mindestens 20 je Punktpaar.\nEin (Standard): vor der ersten Berechnung je Punktpaar ein robustes Mittel - Median, Epochen über 3 Streuungen werden verworfen, Genauigkeit nicht durch Wurzel(n) geteilt; Einzelwerte deaktiviert, Rücknahme jederzeit.\nAus: die Ausgleichung bleibt bei mehr als 20 000 aktiven Basislinien gesperrt, bis im Ablauf-Assistenten „Jetzt ausdünnen“ gewählt wird.
kc98ae8e1=Détecte un très grand nombre de lignes de base GNSS (p. ex. époques toutes les 1-5 s pendant 30 min vers plusieurs stations SAPOS) : plus de 20 000 ou en moyenne au moins 20 par paire de points.\nActivé (par défaut) : avant le premier calcul, une moyenne robuste par paire de points - médiane, les époques au-delà de 3 dispersions sont rejetées, précision non divisée par racine(n) ; valeurs individuelles désactivées, annulation à tout moment.\nDésactivé : la compensation reste bloquée au-delà de 20 000 lignes de base actives jusqu'à ce que « Éclaircir maintenant » soit choisi dans l'assistant de déroulement.
