# de: Legt die Untergrenze der Gruppenunsicherheit (sigma_a/sigma_b/sigma_c) passend zum verwendeten Messinstrument fest.\nElektronisch: bisherige (präzise) Werte.\nHistorisch: größere, für historische Instrumente passende Werte - nur für Horizontalrichtung, Horizontalstrecke, Vertikalrichtung und Schrägstrecke definiert.\nKombiniert: verhält sich identisch zu Elektronisch.\nEinzelne Geräteklassen-Unterarten (z.B. Bussole, Theodolit) werden hier nicht unterschieden - das muss der Nutzer selbst einordnen.
kb0d48a32=Définit la limite inférieure de l'incertitude de groupe (sigma_a/sigma_b/sigma_c) selon l'instrument de mesure utilisé.\nÉlectronique : valeurs (précises) utilisées jusqu'ici.\nHistorique : valeurs plus grandes, adaptées aux instruments historiques - définies uniquement pour direction horizontale, distance horizontale, angle zénithal et distance inclinée.\nCombiné : se comporte de façon identique à Électronique.\nLes sous-types de classe d'instrument (p. ex. boussole, théodolite) ne sont pas distingués ici - c'est à l'utilisateur de faire ce classement.
