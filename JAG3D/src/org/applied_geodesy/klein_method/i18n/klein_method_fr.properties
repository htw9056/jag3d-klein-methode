# de: Liegt Max-logPost beim Erreichen der Abbruchgrenze ab DL 2 noch über dem logPost-Grenzwert, rechnet Phase 2 weiter\nin Richtung Grenzwert. Der jeweils beste Stand (Unsicherheiten, Gruppenwerte, aktive Beobachtungen, Zusatzparameter)\nwird im Projekt gesichert. Wird der Grenzwert nicht erreicht, wird der beste Stand zurückgeschrieben und noch einmal\nausgeglichen; der Lauf endet mit Vermerk und zählt nicht für das Schwarmwissen.\nLag Max-logPost schon in Durchlauf 1 unter dem Grenzwert, wird auch dieser Stand gesichert und übernommen,\nwenn die weiteren Durchläufe den Grenzwert nicht erreichen (dann gilt der Lauf als kalibriert).\nHöchstzahl der Nachlauf-Iterationen. Standard 30, erlaubt 1 bis 200, 0 = Nachlauf und Sicherung aus.
kceead933=Si Max-logPost est encore au-dessus du seuil logPost lorsque la limite d'arrêt à partir de DL 2 est atteinte, la phase 2 continue\nvers le seuil. Le meilleur état obtenu (incertitudes, valeurs de groupe, observations actives, paramètres supplémentaires)\nest sauvegardé dans le projet. Si le seuil n'est pas atteint, le meilleur état est réécrit et compensé encore une fois ;\nl'exécution se termine avec une mention et ne compte pas pour le savoir collectif.\nSi Max-logPost était déjà sous le seuil au cycle 1, cet état est également sauvegardé et repris\nsi les cycles suivants n'atteignent pas le seuil (l'exécution est alors considérée comme calibrée).\nNombre maximal d'itérations de prolongation. Par défaut 30, autorisé 1 à 200, 0 = prolongation et sauvegarde désactivées.
