# de: Im Nivellement sind die Redundanzanteile klein - jeder Höhenunterschied ist kaum kontrolliert. EP ist dort durch die Netzform hoch und kein Hinweis auf einen Messfehler. Bewertet wird deshalb mit logPost.\nIn gemischten Netzen bewertet EP nur die übrigen Messarten, das Nivellement bleibt bei logPost.
kd2cc9f63=En nivellement, les parts de redondance sont faibles : chaque dénivelée est à peine contrôlée. L'EP y est donc élevé à cause de la géométrie du réseau et n'indique pas d'erreur de mesure. L'évaluation se fait donc avec logPost.\nDans les réseaux mixtes, l'EP n'évalue que les autres types d'observation ; le nivellement reste sur logPost.
