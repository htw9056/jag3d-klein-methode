# de: Hinweis: „Höhe“ im lokalen System ist die Höhe über der Tangentialebene in P0 (in 1 km Entfernung ca. 8 cm unter der ellipsoidischen Höhe, Lotrichtung dort um 10 mgon geneigt). Klein_Method stellt die JAG3D-Projektion deshalb auf „lokal ellipsoidisch“ mit Bezugspunkt P0 - JAG3D reduziert dann jede Beobachtung auf die Lotrichtung ihres Punkts. Ergebnisse nach der Ausgleichung exportieren und mit „Punkte: lokal → WGS84“ zurückrechnen.
k6390c698=Remarque : la « hauteur » dans le système local est la hauteur au-dessus du plan tangent en P0 (à 1 km de distance, env. 8 cm sous la hauteur ellipsoïdale, verticale inclinée de 10 mgon). Klein_Method règle donc la projection JAG3D sur « locale ellipsoïdale » avec le point de référence P0 - JAG3D réduit alors chaque observation à la verticale de son point. Exporter les résultats après la compensation de réseau et les reconvertir avec « Points : local → WGS84 ».
