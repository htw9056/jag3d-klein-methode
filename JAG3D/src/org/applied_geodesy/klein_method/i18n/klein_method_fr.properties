# de: Nur für Basislinien: mehrere Zeilen (Epochen/Sessions) derselben Basislinie Start → Ziel.\nEinzeln: jede Zeile wird umgerechnet (wie bisher).\nMittelwert: eine Zeile je Basislinie mit Standardabweichung je Komponente - Streuung der Epochen (n-1), bewusst nicht durch √n geteilt, weil benachbarte Epochen zusammenhängen; mal Faktor, mindestens der Mindestwert. Ausgabe: Start Ziel d1 d2 d3 s1 s2 s3 (JAG3D-Format mit Unsicherheiten).\nRobust: wie Mittelwert, vorher werden Epochen verworfen, die in einer Komponente mehr als 3,5 × MAD (mindestens 3,5 × Mindestwert) vom Median abweichen - ein einzelner Ausreißer verfälscht den Mittelwert sonst. Verworfene Epochen werden gemeldet.\nA→B und B→A bleiben getrennt; kommen beide vor, wird A→B gegen -(B→A) geprüft (Grenze 3σ).\nHinweis: nach dem Mitteln sieht Klein_Method keine einzelnen Sessions mehr (grobe Fehler je Session, Kalibrierung je Session).
kc51ea025=Lignes de base uniquement : plusieurs lignes (époques/sessions) de la même ligne de base départ → arrivée.\nIndividuellement : chaque ligne est convertie (comme avant).\nMoyenne : une ligne par ligne de base avec un écart-type par composante - dispersion des époques (n-1), volontairement non divisée par √n car les époques voisines sont corrélées ; fois le facteur, au moins le minimum. Sortie : départ arrivée d1 d2 d3 s1 s2 s3 (format JAG3D avec incertitudes).\nRobuste : comme la moyenne, mais les époques s'écartant de la médiane de plus de 3,5 × MAD (au moins 3,5 × minimum) dans une composante sont d'abord rejetées - sinon une seule valeur aberrante fausse la moyenne. Les époques rejetées sont signalées.\nA→B et B→A restent séparées ; si les deux existent, A→B est comparée à -(B→A) (limite 3σ).\nRemarque : après la moyenne, Klein_Method ne voit plus les sessions individuelles (fautes et calibrage par session).
