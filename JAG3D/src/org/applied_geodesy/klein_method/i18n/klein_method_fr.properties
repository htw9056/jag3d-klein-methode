k2f4e2d69=À l'ouverture de l'onglet, Klein_Method calcule dans la compensation libre ses propres coordonnées approchées des points nouveaux\n(valeurs initiales issues de déterminations polaires, d'intersections et de systèmes de station, puis compensation préliminaire robuste de toutes les\nobservations, avec datum (calage) sur les points anciens) et les compare aux coordonnées actuelles. En cas d'écart, une\nfenêtre avec recommandation et justification s'affiche. La vérification a lieu une fois par état des données.
