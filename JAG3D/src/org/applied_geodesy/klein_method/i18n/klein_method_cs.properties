# de: Rechnet die geozentrischen 3D-Punkte und 3D-GNSS-Basislinien des geöffneten JAG3D-Projekts nach Rückfrage in das\nlokale System um und stellt die Projektion auf „lokal ellipsoidisch“ (Bezugspunkt = P0). P0: Schwerpunkt der Neupunkte\n(Festpunkte zählen nicht), Breite/Länge auf 0,00001° und Höhe auf 0,01 m gerundet (wird im Projekt gespeichert);\nohne Neupunkte die Grundwerte.\nDie alten Werte werden gesichert.\nBeim Anklicken des Tabs Klein_Method wird das automatisch angeboten, wenn 3D-GNSS-Basislinien erkannt werden.
k5b956578=Po potvrzení převede geocentrické 3D body a 3D základny GNSS otevřeného projektu JAG3D do\nmístního systému a nastaví zobrazení na „místní elipsoidická“ (vztažný bod = P0). P0: těžiště nových bodů\n(pevné body se nezapočítávají), šířka/délka zaokrouhlené na 0,00001° a výška na 0,01 m (uloží se v projektu);\nbez nových bodů výchozí hodnoty.\nStaré hodnoty se zálohují.\nPo kliknutí na kartu Klein_Method se to nabídne automaticky, jsou-li rozpoznány 3D základny GNSS.
