k6f607944=Pouze dynamické vyrovnání: které pohyblivé připojovací body mohou v budoucnu sloužit jako pevné body?\nHodnotí se u každého bodu kalibrovaná individuální nejistota (jedno číslo pro y/x/z) barvami semaforu:\nokrajové body (koncové úseky, vnější obrys, oblasti připojení) podle okrajových mezí, podpůrné body uprostřed podle středních mezí;\nbody 1D (nivelace) podle meze pro výšku, body 2D/3D podle meze pro polohu.\nPoté se zkontroluje rozložení zelených pevných bodů: u protáhlých sítí mezery a konce,\nu plošných sítí to, zda všechny nové body leží uvnitř pevných bodů.\nJde o doporučení - v případě pochybností rozhoduje uživatel.
