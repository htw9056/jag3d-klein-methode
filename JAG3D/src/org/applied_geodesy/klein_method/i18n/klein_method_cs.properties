# de: Das Projekt steht auf „lokal ellipsoidisch“. Der Bezugspunkt (Hauptpunkt) in „Projektion und Reduktion“ passt nicht zum P0, mit dem Klein_Method die Koordinaten umgerechnet hat. JAG3D berechnet daraus die Lotrichtung jedes Punkts - mit dem falschen Bezugspunkt sind Zenitwinkel, Richtungen und Strecken falsch reduziert.\n\nIm Projekt: x0 %s m, y0 %s m, z0 %s m, B %s°, L %s°, h %s m\nP0 (Klein_Method): x0 %s m, y0 %s m, z0 %s m, B %s°, L %s°, h %s m, GRS80\n\nBezugspunkt auf P0 setzen?
