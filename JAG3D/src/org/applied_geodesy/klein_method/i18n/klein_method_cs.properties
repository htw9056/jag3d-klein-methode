k3e18b639=Bezprostředně po sobě jdoucí měření ze stejného stanoviska na stejný cíl (GNSS: epochy jedné seance, laser tracker: řady na jeden bod) nejsou nezávislá. Jako jednotlivá pozorování váží asi sqrt(n)-krát více a odsouvají ostatní měření stranou.\n\nSloučit: jeden průměr na skupinu opakování, jednotlivé hodnoty se deaktivují (nemažou); přesnost alespoň rozptyl skupiny.\nSkoky a drift ve skupině se předem kontrolují. Vrácení kdykoli v nabídce Klein_Method.\n\n
# de: Grenze grober Fehler als lineare Abweichung einer Beobachtung in Metern (Standard 0,10 m).\nEinziges Kriterium - kein logPost oder anderer statistischer Wert:\n• Sperre nach F5: liegt eine Beobachtung darüber, ist nur „Grobe Fehler bereinigen“ aktiv.\n• Bereinigung: nimmt schrittweise die größte Abweichung heraus, bis keine mehr darüber liegt.\n• Fenster: bis zu diesem Wert grün (hält die Ausgleichung aus, wieder aufnehmen), darüber rot (grober Fehler).\nLineare Abweichung = geschätzter grober Fehler aus JAG3D; Richtung/Zenitwinkel mal Strecke, GNSS als 3D-Länge.\nKaum kontrollierte Beobachtungen (Redundanzanteil unter 5 %) sind nicht prüfbar und zählen nicht mit.\nErlaubt: 
k3e3dc535=Mez hrubé chyby jako lineární odchylka měření v metrech (výchozí 0,10 m).\nJediné kritérium – žádný logPost ani jiná statistická hodnota:\n• Zámek po F5: leží-li některé měření nad ní, je aktivní pouze „Odstranit hrubé chyby“.\n• Odstranění: postupně vyřazuje největší odchylku, dokud žádná nezůstane nad ní.\n• Okno: do této hodnoty zeleně (vyrovnání to snese, znovu zahrnout), nad ní červeně (hrubá chyba).\nLineární odchylka = odhadnutá hrubá chyba z JAG3D; směr/zenitový úhel krát délka, GNSS jako 3D délka.\nTéměř nekontrolovaná měření (podíl nadbytečnosti pod 5 %) nelze ověřit a nezapočítávají se.\nPovoleno: 
