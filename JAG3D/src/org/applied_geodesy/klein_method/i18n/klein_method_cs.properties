# de: Erzwingt beim Uebergang zu PHASE: DONE einmalig eine Abschluss-Kompression aller bereits individuell kalibrierten sigma_0-Werte in Richtung der geodaetischen Mindestwerte (sigma_Boden, z.B. 0.5 mm bei Horizontalstrecke): sigma_neu = sigma_Boden + (sigma_alt - sigma_Boden) * 0.4. Wirkt NUR bei diesem einen Uebergang, NICHT waehrend der laufenden Iteration (dort weiterhin keine Untergrenze, User-Vorgabe V0.308).
