k3c2a51b4=Urychluje individuální kalibraci pevných bodů (dynamické vyrovnání, fáze 2), jakmile je hotova polovina.\nPouze při zmenšování. Při změně směru pauza 5 kroků, při 2. změně vypnuto.\nPokud T_prio bodu pod pásmem třikrát po sobě téměř stojí, přestože se sigma zmenšuje,\nbod přejde přímo na dolní mez – platí to ihned, ne až od poloviny.\nFáze 1 (skupiny bodů) se počítá vždy bez turba.
