# de: Legt die Untergrenze der Gruppenunsicherheit (sigma_a/sigma_b/sigma_c) passend zum verwendeten Messinstrument fest.\nElektronisch: bisherige (präzise) Werte.\nHistorisch: größere, für historische Instrumente passende Werte - nur für Horizontalrichtung, Horizontalstrecke, Vertikalrichtung und Schrägstrecke definiert.\nKombiniert: verhält sich identisch zu Elektronisch.\nEinzelne Geräteklassen-Unterarten (z.B. Bussole, Theodolit) werden hier nicht unterschieden - das muss der Nutzer selbst einordnen.
kb0d48a32=Ustala wartość minimalną niepewności grupy (sigma_a/sigma_b/sigma_c) odpowiednią do używanego instrumentu pomiarowego.\nElektroniczny: dotychczasowe (precyzyjne) wartości.\nHistoryczny: większe wartości odpowiednie dla instrumentów historycznych - zdefiniowane tylko dla kierunku poziomego, odległości poziomej, kąta zenitalnego i odległości skośnej.\nKombinowany: zachowuje się identycznie jak Elektroniczny.\nPoszczególne podtypy klas instrumentów (np. busola, teodolit) nie są tu rozróżniane - użytkownik musi sam je zakwalifikować.
