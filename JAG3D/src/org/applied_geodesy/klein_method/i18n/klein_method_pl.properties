# de: Genauer als dieser Wert wird ein Festpunkt (beweglicher Anschlusspunkt) in der dynamischen AGL nicht angesetzt.\nIst ein Festpunkt mit den vorhandenen Messungen nicht prüfbar, würde seine Genauigkeit sonst bis fast null sinken:\ner wäre praktisch starr, und die Messungen (z. B. GNSS-Basislinien) hätten keinen Einfluss mehr auf ihn.\nLiegt ein Festpunkt am Ende an dieser Untergrenze, steht ein Hinweis im Protokoll.\nGilt nur, wenn das Projekt aktive GNSS-Basislinien hat - ohne GNSS gilt 0,01 mm (Lage und Höhe).\nStandard 1,0 mm, erlaubt 0,01 bis 50 mm.
kcf7f6922=W AGL dynamicznym punkt stały (ruchomy punkt nawiązania) nie otrzymuje dokładności lepszej niż ta wartość.\nJeśli punktu stałego nie da się sprawdzić dostępnymi pomiarami, jego dokładność spadłaby inaczej prawie do zera:\nbyłby praktycznie sztywny, a pomiary (np. wektory GNSS) nie miałyby już na niego wpływu.\nJeśli punkt stały kończy na tej dolnej granicy, w protokole pojawia się uwaga.\nObowiązuje tylko, gdy projekt ma aktywne wektory GNSS - bez GNSS obowiązuje 0,01 mm (położenie i wysokość).\nDomyślnie 1,0 mm, dozwolone 0,01 do 50 mm.
# de: Schreibt den Kalibrierungsnachweis mit dem aktuellen Stand als Textdatei in den Protokollordner:\nje Beobachtungstyp, Gruppe und Komponente Start- und Endwert, VKS, Band, Redundanz, Anzahl und Status,\ndazu robuste VKS, Plausibilität gegen Datenblattwerte und Modellprüfung a/c.\nNach jedem Automatik-Lauf der freien/fixen Ausgleichung wird er automatisch geschrieben (dann mit Startwerten).
kcf924f79=Zapisuje zaświadczenie o kalibracji z bieżącym stanem jako plik tekstowy w folderze protokołów:\ndla każdego typu obserwacji, grupy i składowej wartość początkowa i końcowa, VKS, pasmo, nadliczbowość, liczba i status,\nponadto odporne VKS, wiarygodność względem wartości z kart katalogowych i kontrola modelu a/c.\nPo każdym automatycznym przebiegu wyrównania swobodnego/ze stałymi punktami jest zapisywane automatycznie (wtedy z wartościami startowymi).
