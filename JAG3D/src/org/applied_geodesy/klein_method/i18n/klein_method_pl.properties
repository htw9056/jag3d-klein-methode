# de: Liegt Max-logPost beim Erreichen der Abbruchgrenze ab DL 2 noch über dem logPost-Grenzwert, rechnet Phase 2 weiter\nin Richtung Grenzwert. Der jeweils beste Stand (Unsicherheiten, Gruppenwerte, aktive Beobachtungen, Zusatzparameter)\nwird im Projekt gesichert. Wird der Grenzwert nicht erreicht, wird der beste Stand zurückgeschrieben und noch einmal\nausgeglichen; der Lauf endet mit Vermerk und zählt nicht für das Schwarmwissen.\nLag Max-logPost schon in Durchlauf 1 unter dem Grenzwert, wird auch dieser Stand gesichert und übernommen,\nwenn die weiteren Durchläufe den Grenzwert nicht erreichen (dann gilt der Lauf als kalibriert).\nHöchstzahl der Nachlauf-Iterationen. Standard 30, erlaubt 1 bis 200, 0 = Nachlauf und Sicherung aus.
kceead933=Jeśli Max-logPost po osiągnięciu granicy przerwania od DL 2 nadal przekracza wartość graniczną logPost, faza 2 liczy dalej\nw kierunku wartości granicznej. Najlepszy dotychczasowy stan (niepewności, wartości grup, aktywne obserwacje, parametry dodatkowe)\njest zapisywany w projekcie. Jeśli wartość graniczna nie zostanie osiągnięta, najlepszy stan zostaje przywrócony i ponownie wyrównany;\nprzebieg kończy się z adnotacją i nie liczy się do wiedzy roju.\nJeśli Max-logPost już w przebiegu 1 był poniżej wartości granicznej, również ten stan jest zapisywany i przyjmowany,\ngdy dalsze przebiegi nie osiągną wartości granicznej (przebieg uznaje się wtedy za skalibrowany).\nMaksymalna liczba iteracji przebiegu dodatkowego. Domyślnie 30, dozwolone 1 do 200, 0 = przebieg dodatkowy i kopia wył.
