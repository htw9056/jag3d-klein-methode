k3305e40a=Jeśli Max-logPost w wyrównaniu swobodnym lub ze stałymi punktami (faza 2) waha się piłokształtnie (w ostatnich 4 wartościach co najmniej 2 zmiany kierunku),\nw trybie „normalny” zapisywana jest tylko połowa obliczonego kroku: sigma_nowa = sigma_stara + 0,5 · (sigma_wzór − sigma_stara).\nDotyczy GNSS w trybie „normalny” (również podczas przełączenia przez strażnika) oraz kierunków, odległości i niwelacji.\nPróba – domyślnie wyłączone. Efekt w protokole: wiersz „DAEMPFUNG NORMAL”.
