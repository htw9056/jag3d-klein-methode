# de: Ein: je Punkt ein Messart-Symbol (Torte aus allen Messarten an diesem Punkt: GNSS violett, Strecke, Richtung, Zenitwinkel farbig) genau auf dem Punkt.\nAus (Standard): keine Messart-Symbole, nur Punkte und Linien.\nDer JAG3D-Netzplot zeichnet die Symbole ein Stück entlang jeder Linie; laufen viele Linien in dieselbe Richtung (z. B. zu fernen Referenzstationen), wirken sie dort wie eine verschobene Punktwolke - deshalb setzt die Karte sie auf den Punkt.\nNur Anzeige in der Karte - der Netzplot und seine Einstellungen bleiben unverändert.
k13d6ca9a=Wł.: jeden symbol obserwacji na punkt (wykres kołowy wszystkich rodzajów obserwacji w tym punkcie: GNSS fioletowy, odległość, kierunek, kąt zenitalny kolorowo) dokładnie na punkcie.\nWył. (domyślnie): bez symboli obserwacji, tylko punkty i linie.\nWykres sieci JAG3D rysuje symbole kawałek wzdłuż każdej linii; gdy wiele linii biegnie w tym samym kierunku (np. do odległych stacji referencyjnych), wyglądają tam jak przesunięta chmura punktów - dlatego mapa umieszcza je na punkcie.\nTylko wyświetlanie na mapie - wykres sieci i jego ustawienia pozostają bez zmian.
