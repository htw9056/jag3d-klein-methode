# de: Alle Beobachtungen eines Typs, deren |logPost| innerhalb dieser linearen Nachbarschaft um den aktuellen Max-logPost-Wert liegen ([Max_logPost - Delta; Max_logPost]), werden im selben Iterationsschritt KOLLEKTIV gedaempft. Ergaenzt (erweitert) den bestehenden, logarithmischen Trichter-Faktor, ersetzt ihn NICHT - wirksam ist stets das groesszuegigere der beiden Baender. Standard 0.20 (logPost-Einheiten, einheitenlos).
kaf283747=Wszystkie obserwacje jednego typu, których |logPost| mieści się w tym liniowym sąsiedztwie wokół aktualnej maksymalnej wartości logPost ([Max_logPost - Delta; Max_logPost]), są w tym samym kroku iteracji tłumione ZBIOROWO. Uzupełnia (rozszerza) istniejący, logarytmiczny współczynnik lejka, NIE zastępuje go - zawsze obowiązuje szersze z obu pasm. Domyślnie 0.20 (jednostki logPost, bezwymiarowe).
