# de: Ein (Standard): Startwerte der Höhe zuerst aus Nivellement, dann aus trigonometrischen Höhen, GNSS-Höhen nur\nfür Punkte, die sonst keine Höhe bekommen; Startwerte der Lage zuerst terrestrisch, dann GNSS.\nIn der Höhe zählen wiederholte GNSS-Sessions zwischen denselben Punkten zusammen wie eine Basislinie,\nund die GNSS-Höhe bekommt die 3-fache Lageunsicherheit - viele Sessions überstimmen so nicht die terrestrischen Höhen.\nAus: alle Beobachtungsarten gleichrangig (wie bis V0.417).
kb4401ec6=Włączone (domyślnie): wartości startowe wysokości najpierw z niwelacji, potem z wysokości trygonometrycznych, wysokości GNSS tylko\ndla punktów, które inaczej nie otrzymają wysokości; wartości startowe położenia najpierw naziemnie, potem GNSS.\nW wysokości powtarzane sesje GNSS między tymi samymi punktami liczą się razem jak jeden wektor,\na wysokość GNSS otrzymuje 3-krotną niepewność położenia - wiele sesji nie przegłosuje wysokości naziemnych.\nWyłączone: wszystkie rodzaje obserwacji równorzędne (jak do V0.417).
