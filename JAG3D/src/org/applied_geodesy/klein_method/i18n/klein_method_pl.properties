k5b956578=Po potwierdzeniu przelicza geocentryczne punkty 3D i bazy GNSS 3D otwartego projektu JAG3D do\nukładu lokalnego i ustawia odwzorowanie na „lokalne elipsoidalne” (punkt odniesienia = P0). P0: środek ciężkości punktów nowych\n(punkty stałe nie są uwzględniane), szerokość/długość zaokrąglone do 0,00001° i wysokość do 0,01 m (zapisywane w projekcie);\nbez punktów nowych wartości domyślne.\nStare wartości są zabezpieczane.\nPo kliknięciu zakładki Klein_Method jest to proponowane automatycznie, jeśli wykryto bazy GNSS 3D.
