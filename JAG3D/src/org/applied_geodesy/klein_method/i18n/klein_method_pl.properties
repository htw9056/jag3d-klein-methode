# de: V0.353:\nDurchlauf 1 endet bei Max-logPost unter 2,45. Ist „Untergrenze erzwingen“ und/oder „Gruppen-σ nach DL 1“ eingeschaltet, werden die Werte dort zurückgesetzt und Durchlauf 2 startet.\nAb Durchlauf 2 beendet Max-logPost unter der „Abbruchgrenze ab DL 2“ (Standard 5,2) bzw. unter 2,45 die Berechnung (ohne weitere Untergrenzen-Erzwingung).\nEndet ein Durchlauf am Grenzwert Iterationen ohne 2,45, startet der nächste.\nAbbruchziel: Durchlauf 3 = bester Max-logPost aus Durchlauf 2 (nur unter 5,2), ab Durchlauf 4 = 5,2. Maximal 20 Durchläufe.
k7d40cde9=V0.353:\nPrzebieg 1 kończy się przy Max-logPost poniżej 2,45. Jeśli włączone jest „Wymuszaj wartość minimalną” i/lub „Grupowe σ po DL 1”, wartości są tam resetowane i rozpoczyna się przebieg 2.\nOd przebiegu 2 obliczenia kończą się, gdy Max-logPost spadnie poniżej „Granicy przerwania od DL 2” (domyślnie 5,2) lub poniżej 2,45 (bez dalszego wymuszania wartości minimalnej).\nJeśli przebieg kończy się na wartości granicznej iteracji bez osiągnięcia 2,45, rozpoczyna się kolejny.\nCel przerwania: przebieg 3 = najlepszy Max-logPost z przebiegu 2 (tylko poniżej 5,2), od przebiegu 4 = 5,2. Maksymalnie 20 przebiegów.
