k3c2a51b4=Przyspiesza indywidualną kalibrację punktów stałych (dynamiczne AGL, faza 2), gdy połowa jest gotowa.\nTylko przy zmniejszaniu. Przy zmianie kierunku 5 kroków przerwy, przy 2. zmianie wyłączenie.\nJeśli T_prio punktu poniżej pasma trzy razy z rzędu prawie się nie zmienia, choć sigma jest zmniejszana,\npunkt przechodzi bezpośrednio na dolną granicę – obowiązuje to od razu, nie dopiero od połowy.\nFaza 1 (grupy punktów) zawsze liczy bez turbo.
