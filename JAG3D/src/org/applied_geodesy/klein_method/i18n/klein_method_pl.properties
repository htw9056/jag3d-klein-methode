k3e18b639=Bezpośrednio następujące po sobie pomiary z tego samego stanowiska do tego samego celu (GNSS: epoki jednej sesji, laser tracker: serie na jeden punkt) nie są niezależne. Jako pojedyncze obserwacje ważą około sqrt(n) razy za dużo i spychają pozostałe pomiary na margines.\n\nUśrednij: jedna średnia na grupę powtórzeń, wartości pojedyncze są wyłączane (nie usuwane); dokładność co najmniej rozrzut grupy.\nSkoki i dryf w grupie są wcześniej sprawdzane. Cofnięcie w każdej chwili w menu Klein_Method.\n\n
# de: Grenze grober Fehler als lineare Abweichung einer Beobachtung in Metern (Standard 0,10 m).\nEinziges Kriterium - kein logPost oder anderer statistischer Wert:\n• Sperre nach F5: liegt eine Beobachtung darüber, ist nur „Grobe Fehler bereinigen“ aktiv.\n• Bereinigung: nimmt schrittweise die größte Abweichung heraus, bis keine mehr darüber liegt.\n• Fenster: bis zu diesem Wert grün (hält die Ausgleichung aus, wieder aufnehmen), darüber rot (grober Fehler).\nLineare Abweichung = geschätzter grober Fehler aus JAG3D; Richtung/Zenitwinkel mal Strecke, GNSS als 3D-Länge.\nKaum kontrollierte Beobachtungen (Redundanzanteil unter 5 %) sind nicht prüfbar und zählen nicht mit.\nErlaubt: 
k3e3dc535=Granica błędów grubych jako odchyłka liniowa obserwacji w metrach (domyślnie 0,10 m).\nJedyne kryterium - brak logPost lub innej wartości statystycznej:\n• Blokada po F5: jeśli obserwacja ją przekracza, aktywne jest tylko „Usuń błędy grube“.\n• Usuwanie: krokowo wyjmuje największą odchyłkę, aż żadna nie przekracza granicy.\n• Okno: do tej wartości zielone (wytrzymuje wyrównanie, przywrócenie), powyżej czerwone (błąd gruby).\nOdchyłka liniowa = szacowany błąd gruby z JAG3D; kierunek/kąt zenitalny razy odległość, GNSS jako długość 3D.\nSłabo kontrolowane obserwacje (udział nadliczbowości poniżej 5%) nie są sprawdzalne i się nie liczą.\nDozwolone: 
