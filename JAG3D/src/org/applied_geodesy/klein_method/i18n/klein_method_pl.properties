# de: Schreibt Erfahrungswerte als Gruppenunsicherheit (Startwerte für Phase 1) - erst nach Vorschau und „Übernehmen“.\nDynamische Ausgleichung: Startwert je Dimension für alle beweglichen Anschlusspunkte (nur gleiche Festpunktart).\nNur Werte aus ANDEREN Projekten, die sich untereinander höchstens 10 % unterscheiden (Gruppe um den Median, mindestens 3 Projekte).\nAbweichende Projekte werden weggelassen und in der Vorschau genannt; ohne passende Gruppe bleibt der Wert unverändert.\nDeaktivierte Komponenten (0) bleiben 0, Untergrenzen werden eingehalten. Danach wird das Netz neu ausgeglichen.
