# de: Nur dynamische und fixe AGL. Ein: Die 3D-Fest- bzw. Anschlusspunkte (GNSS, Tachymeter) bestimmen nur noch die Lage, ihre Höhe ist frei (σz = 10 m). Die Höhe kommt ausschließlich aus den Höhenfestpunkten (1D) über das Nivellement.\nDynamische AGL: die Festpunktanalyse bewertet bei 3D-Punkten nur die Lage. Fixe AGL: die varianzfreien 3D-Festpunkte kommen in eine eigene Gruppe, die in der Lage praktisch fest ist (σ 0,01 mm).\nVoraussetzung: Höhenfestpunkte im selben Höhensystem (NHN vorher mit dem Quasigeoid umrechnen), über Nivellement verbunden, empfohlen mindestens 3; in der fixen AGL mindestens einer varianzfrei.\nAus: alle Werte exakt wie vorher.
k14563907=Tylko wyrównanie dynamiczne i stałe. Wł.: punkty stałe/dowiązania 3D (GNSS, tachimetr) wyznaczają tylko położenie, ich wysokość jest wolna (σz = 10 m). Wysokość pochodzi wyłącznie z punktów wysokościowych (1D) przez niwelację.\nWyrównanie dynamiczne: analiza punktów stałych ocenia dla punktów 3D tylko położenie. Wyrównanie stałe: bezwariancyjne punkty stałe 3D trafiają do osobnej grupy, praktycznie stałej w położeniu (σ 0,01 mm).\nWarunek: punkty wysokościowe w tym samym systemie wysokości (NHN najpierw przeliczyć quasigeoidą), połączone niwelacją, zalecane co najmniej 3; w wyrównaniu stałym co najmniej jeden bezwariancyjny.\nWył.: wszystkie wartości dokładnie jak wcześniej.
