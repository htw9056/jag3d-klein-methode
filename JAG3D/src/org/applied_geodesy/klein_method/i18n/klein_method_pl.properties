# de: Die betroffene GNSS-Basislinie bleibt zu 100% AKTIV im Netz und wird ueber die Kaskade weiter Richtung Boden gedaempft, jedoch NIEMALS automatisch inaktiv geschaltet - verhindert den unkontrollierten Verlust geometrischer Redundanz. V0.346: gilt auch fuer die Achsen-Uebersteuerung im Modus „prozentual“ - die Achsenwerte werden dann auf 0,1-35 mm geklemmt, die Basislinie bleibt aktiv.
k911e2298=Dotknięty wektor GNSS pozostaje w 100% AKTYWNY w sieci i jest dalej tłumiony przez kaskadę w kierunku wartości dolnej, ale NIGDY nie jest automatycznie dezaktywowany - zapobiega to niekontrolowanej utracie redundancji geometrycznej. V0.346: dotyczy to również przesterowania osi w trybie „procentowy” - wartości osi są wtedy ograniczane do 0,1-35 mm, wektor pozostaje aktywny.
