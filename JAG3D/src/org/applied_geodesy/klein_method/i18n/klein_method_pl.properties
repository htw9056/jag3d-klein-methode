# de: Nur dynamische Ausgleichung: Welche beweglichen Anschlusspunkte können künftig als Festpunkte dienen?\nBewertet wird je Punkt die kalibrierte individuelle Unsicherheit (eine Zahl für y/x/z) in Ampelfarben:\nRandpunkte (Endbereiche, äußere Umrandung, Anschlussbereiche) mit den Rand-Grenzen, Stützpunkte in der Mitte mit den Mitte-Grenzen;\n1D-Punkte (Nivellement) jeweils mit der Höhen-, 2D/3D-Punkte mit der Lage-Grenze.\nDanach wird die Verteilung der grünen Festpunkte geprüft: langgestreckte Netze auf Lücken und Enden,\nflächige Netze darauf, dass alle Neupunkte innerhalb der Festpunkte liegen.\nEs ist eine Empfehlung - im Zweifel entscheidet der Anwender.
k6f607944=Tylko wyrównanie dynamiczne: które ruchome punkty nawiązania mogą w przyszłości służyć jako punkty stałe?\nDla każdego punktu oceniana jest skalibrowana niepewność indywidualna (jedna liczba dla y/x/z) w kolorach sygnalizacji:\npunkty brzegowe (strefy końcowe, zewnętrzny obrys, obszary nawiązania) według granic brzegowych, punkty podporowe w środku według granic środkowych;\npunkty 1D (niwelacja) według granicy wysokości, punkty 2D/3D według granicy położenia.\nNastępnie sprawdzany jest rozkład zielonych punktów stałych: w sieciach wydłużonych pod kątem luk i zakończeń,\nw sieciach powierzchniowych pod kątem tego, czy wszystkie punkty nowe leżą wewnątrz punktów stałych.\nTo tylko rekomendacja - w razie wątpliwości decyduje użytkownik.
