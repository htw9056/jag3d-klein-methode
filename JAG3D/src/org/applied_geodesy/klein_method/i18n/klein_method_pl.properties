k90830d93=Tylko przy wielokrotnym przebiegu kaskadowym: od przebiegu 2 obliczenia kończą się, gdy Max-logPost spadnie poniżej tej wartości (bez wymuszania wartości minimalnej, aktualny stan zostaje zachowany).\nPrzy 2,45 przebieg 2 kończy się dopiero przy pełnej kalibracji (rygorystycznie).\nDozwolone: 
# de: Nur aktiv, wenn nach F5 grobe Fehler vermutet werden: eine Beobachtung weicht linear um mehr als\ndie „Grenze grober Fehler (m)“ ab (Standard 0,10 m) - dann ist „Klein_Method starten“ gesperrt, bis bereinigt ist.\nKein logPost oder anderer statistischer Wert, nur die lineare Abweichung in Metern.\n\nAblauf: die Beobachtung mit der größten linearen Abweichung wird vorübergehend deaktiviert und neu gerechnet, dann die nächste -\nbis keine mehr über der Grenze liegt (schrittweise, weil ein grober Fehler auch gesunde Nachbarn auffällig macht).\nDanach entscheidest du je Beobachtung: grober Fehler (bleibt für Phase 1 außen vor) oder kein grober Fehler (wieder aufnehmen).\nVor Phase 2 fragt Klein_Method nach, ob die groben Fehler wieder aufgenommen oder deaktiviert gelassen werden.\nNur freie und fixe Ausgleichung. Auch in der Karte verfügbar.
k90892722=Aktywne tylko wtedy, gdy po F5 podejrzewane są błędy grube: obserwacja odbiega liniowo o więcej niż\n„Granica błędów grubych (m)“ (domyślnie 0,10 m) - wtedy „Uruchom Klein_Method“ jest zablokowane, dopóki błędy nie zostaną usunięte.\nBrak logPost ani innej wartości statystycznej, tylko odchyłka liniowa w metrach.\n\nPrzebieg: obserwacja z największą odchyłką liniową jest tymczasowo dezaktywowana i przeliczana ponownie, następnie kolejna -\naż żadna nie przekracza granicy (krokowo, ponieważ błąd gruby uwidacznia też zdrowych sąsiadów).\nPotem decydujesz dla każdej obserwacji: błąd gruby (pozostaje poza fazą 1) lub brak błędu grubego (przywrócenie).\nPrzed fazą 2 Klein_Method pyta, czy błędy grube mają zostać przywrócone, czy pozostać dezaktywowane.\nTylko wyrównanie swobodne i ze stałymi punktami. Dostępne również na mapie.
