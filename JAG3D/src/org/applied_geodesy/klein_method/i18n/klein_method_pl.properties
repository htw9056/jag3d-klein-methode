# de: Wirkt nur bei GNSS-Basislinien im Verteilungsmodus „prozentual“:\n1. „gedämpfter Achs Split“ (Empfehlung): Korrektur nach den Achsen X/Y/Z aufgeteilt (Anteil je Achse aus dem EP), gedämpft - im Vergleich stabil und zeigt die schwächere GNSS-Höhe.\n2. „Lage/Höhe-Split“: Korrektur nach Lage (horizontal) und Höhe (Lotrichtung) aufgeteilt, gedämpft; die Lotrichtung wird je Basislinie aus den ausgeglichenen Koordinaten bestimmt - am stabilsten, unterscheidet Höhe/Lage aber kaum.\n3. „einfache Anpassung“: sigma_neu = sigma_alt + sigma_alt*log10(F), alle Achsen gleich - am unruhigsten.\nIm Modus „normal“ gilt immer die einfache Anpassung.
kaf9504e2=Działa tylko przy wektorach GNSS w trybie rozkładu „procentowy”:\n1. „tłumiony podział na osie“ (zalecane): korekta podzielona na osie X/Y/Z (udział każdej osi z EP), tłumiona - porównawczo stabilna i pokazuje słabszą wysokość GNSS.\n2. „podział pozycja/wysokość“: korekta podzielona na pozycję (poziomo) i wysokość (kierunek pionu), tłumiona; kierunek pionu jest wyznaczany dla każdego wektora z wyrównanych współrzędnych - najbardziej stabilna, ale prawie nie rozróżnia wysokości i pozycji.\n3. „prosta korekta“: sigma_neu = sigma_alt + sigma_alt*log10(F), wszystkie osie tak samo - najbardziej niespokojna.\nW trybie „normalny“ zawsze obowiązuje prosta korekta.
