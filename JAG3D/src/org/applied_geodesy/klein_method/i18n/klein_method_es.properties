# de: Liegt Max-logPost beim Erreichen der Abbruchgrenze ab DL 2 noch über dem logPost-Grenzwert, rechnet Phase 2 weiter\nin Richtung Grenzwert. Der jeweils beste Stand (Unsicherheiten, Gruppenwerte, aktive Beobachtungen, Zusatzparameter)\nwird im Projekt gesichert. Wird der Grenzwert nicht erreicht, wird der beste Stand zurückgeschrieben und noch einmal\nausgeglichen; der Lauf endet mit Vermerk und zählt nicht für das Schwarmwissen.\nLag Max-logPost schon in Durchlauf 1 unter dem Grenzwert, wird auch dieser Stand gesichert und übernommen,\nwenn die weiteren Durchläufe den Grenzwert nicht erreichen (dann gilt der Lauf als kalibriert).\nHöchstzahl der Nachlauf-Iterationen. Standard 30, erlaubt 1 bis 200, 0 = Nachlauf und Sicherung aus.
kceead933=Si Max-logPost sigue por encima del valor límite logPost al alcanzar el límite de interrupción desde PA 2, la fase 2 sigue calculando\nhacia el valor límite. El mejor estado obtenido (incertidumbres, valores de grupo, observaciones activas, parámetros adicionales)\nse guarda en el proyecto. Si no se alcanza el valor límite, se reescribe el mejor estado y se ajusta una vez más;\nla ejecución termina con una nota y no cuenta para el conocimiento colectivo.\nSi Max-logPost ya estaba por debajo del valor límite en la pasada 1, ese estado también se guarda y se adopta\nsi las pasadas siguientes no alcanzan el valor límite (la ejecución se considera entonces calibrada).\nNúmero máximo de iteraciones de prolongación. Por defecto 30, permitido 1 a 200, 0 = prolongación y copia desactivadas.
