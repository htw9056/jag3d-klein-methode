k6390c698=Nota: la «altura» en el sistema local es la altura sobre el plano tangente en P0 (a 1 km de distancia aprox. 8 cm por debajo de la altura elipsoidal, vertical allí inclinada 10 mgon). Por eso Klein_Method ajusta la proyección de JAG3D a «local elipsoidal» con punto de referencia P0 - JAG3D reduce entonces cada observación a la vertical de su punto. Exporte los resultados tras el ajuste y vuelva a convertirlos con «Puntos: local → WGS84».
