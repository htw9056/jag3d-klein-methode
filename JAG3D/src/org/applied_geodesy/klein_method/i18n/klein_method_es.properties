# de: Nur dynamische und fixe AGL. Ein: Die 3D-Fest- bzw. Anschlusspunkte (GNSS, Tachymeter) bestimmen nur noch die Lage, ihre Höhe ist frei (σz = 10 m). Die Höhe kommt ausschließlich aus den Höhenfestpunkten (1D) über das Nivellement.\nDynamische AGL: die Festpunktanalyse bewertet bei 3D-Punkten nur die Lage. Fixe AGL: die varianzfreien 3D-Festpunkte kommen in eine eigene Gruppe, die in der Lage praktisch fest ist (σ 0,01 mm).\nVoraussetzung: Höhenfestpunkte im selben Höhensystem (NHN vorher mit dem Quasigeoid umrechnen), über Nivellement verbunden, empfohlen mindestens 3; in der fixen AGL mindestens einer varianzfrei.\nAus: alle Werte exakt wie vorher.
k14563907=Solo ajuste dinámico y fijo. Activado: los puntos fijos/de enlace 3D (GNSS, estación total) solo definen la posición, su altura queda libre (σz = 10 m). La altura procede exclusivamente de los puntos altimétricos (1D) a través de la nivelación.\nAjuste dinámico: el análisis de puntos fijos evalúa solo la posición de los puntos 3D. Ajuste fijo: los puntos fijos 3D sin varianza pasan a un grupo propio, prácticamente fijo en posición (σ 0,01 mm).\nRequisito: puntos altimétricos en el mismo sistema de alturas (convertir antes NHN con el cuasigeoide), conectados por nivelación, se recomiendan al menos 3; en el ajuste fijo al menos uno sin varianza.\nDesactivado: todos los valores exactamente como antes.
