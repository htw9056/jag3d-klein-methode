k7d40cde9=V0.353:\nLa pasada 1 termina cuando Max-logPost está por debajo de 2,45. Si «Imponer valor mínimo» y/o «σ de grupo tras PA 1» están activados, los valores se restablecen ahí y comienza la pasada 2.\nA partir de la pasada 2, el cálculo termina cuando Max-logPost está por debajo del «límite de interrupción desde PA 2» (estándar 5,2) o por debajo de 2,45 (sin más imposición de valores mínimos).\nSi una pasada termina en el valor límite de iteraciones sin alcanzar 2,45, comienza la siguiente.\nObjetivo de interrupción: pasada 3 = mejor Max-logPost de la pasada 2 (solo si está por debajo de 5,2), desde la pasada 4 = 5,2. Máximo 20 pasadas.
