# de: Schreibt Erfahrungswerte als Gruppenunsicherheit (Startwerte für Phase 1) - erst nach Vorschau und „Übernehmen“.\nDynamische Ausgleichung: Startwert je Dimension für alle beweglichen Anschlusspunkte (nur gleiche Festpunktart).\nNur Werte aus ANDEREN Projekten, die sich untereinander höchstens 10 % unterscheiden (Gruppe um den Median, mindestens 3 Projekte).\nAbweichende Projekte werden weggelassen und in der Vorschau genannt; ohne passende Gruppe bleibt der Wert unverändert.\nDeaktivierte Komponenten (0) bleiben 0, Untergrenzen werden eingehalten. Danach wird das Netz neu ausgeglichen.
k24af24c7=Escribe los valores empíricos como incertidumbre de grupo (valores de inicio para la fase 1) - solo tras vista previa y «Aplicar».\nAjuste dinámico: valor de inicio por dimensión para todos los puntos de enlace móviles (solo mismo tipo de punto de control).\nSolo valores de OTROS proyectos que difieran entre sí como máximo un 10% (grupo en torno a la mediana, al menos 3 proyectos).\nLos proyectos discordantes se descartan y se mencionan en la vista previa; sin un grupo adecuado el valor queda sin cambios.\nLos componentes desactivados (0) permanecen en 0, se respetan los valores mínimos. Después se vuelve a ajustar la red.
