# de: Beschleunigt die Einzelkalibrierung der Festpunkte (dynamische AGL, Phase 2), sobald die Hälfte fertig ist.\nNur beim Verkleinern. Bei Richtungswechsel 5 Schritte Pause, beim 2. Wechsel aus.\nSteht T_prio eines Punkts unter dem Band dreimal in Folge fast still, obwohl sigma verkleinert wird,\ngeht der Punkt direkt auf die Untergrenze – das gilt sofort, nicht erst ab der Hälfte.\nPhase 1 (Punktgruppen) rechnet immer ohne Turbo.
k3c2a51b4=Acelera la calibración individual de los puntos de control (AGL dinámico, fase 2) en cuanto se ha completado la mitad.\nSolo al reducir. Al cambiar de sentido, 5 pasos de pausa; en el 2.º cambio, se desactiva.\nSi el T_prio de un punto por debajo de la banda apenas cambia tres veces seguidas aunque se reduce sigma,\nel punto pasa directamente al límite inferior; esto se aplica de inmediato, no solo a partir de la mitad.\nLa fase 1 (grupos de puntos) siempre calcula sin turbo.
