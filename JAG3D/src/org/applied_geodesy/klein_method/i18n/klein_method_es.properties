# de: Genauer als dieser Wert wird ein Festpunkt (beweglicher Anschlusspunkt) in der dynamischen AGL nicht angesetzt.\nIst ein Festpunkt mit den vorhandenen Messungen nicht prüfbar, würde seine Genauigkeit sonst bis fast null sinken:\ner wäre praktisch starr, und die Messungen (z. B. GNSS-Basislinien) hätten keinen Einfluss mehr auf ihn.\nLiegt ein Festpunkt am Ende an dieser Untergrenze, steht ein Hinweis im Protokoll.\nGilt nur, wenn das Projekt aktive GNSS-Basislinien hat - ohne GNSS gilt 0,01 mm (Lage und Höhe).\nStandard 1,0 mm, erlaubt 0,01 bis 50 mm.
kcf7f6922=En el ajuste dinámico, a un punto fijo (punto de enlace móvil) nunca se le asigna una precisión mejor que este valor.\nSi un punto fijo no puede comprobarse con las mediciones disponibles, su precisión bajaría si no casi a cero:\nsería prácticamente rígido y las mediciones (p. ej. líneas base GNSS) ya no tendrían influencia sobre él.\nSi un punto fijo termina en este límite inferior, se escribe una nota en el protocolo.\nSolo se aplica si el proyecto tiene líneas base GNSS activas - sin GNSS se aplica 0,01 mm (posición y altura).\nPor defecto 1,0 mm, permitido de 0,01 a 50 mm.
