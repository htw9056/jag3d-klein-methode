# de: Nur aktiv, wenn nach F5 grobe Fehler vermutet werden: eine Beobachtung weicht linear um mehr als\ndie „Grenze grober Fehler (m)“ ab (Standard 0,10 m) - dann ist „Klein_Method starten“ gesperrt, bis bereinigt ist.\nKein logPost oder anderer statistischer Wert, nur die lineare Abweichung in Metern.\n\nAblauf: die Beobachtung mit der größten linearen Abweichung wird vorübergehend deaktiviert und neu gerechnet, dann die nächste -\nbis keine mehr über der Grenze liegt (schrittweise, weil ein grober Fehler auch gesunde Nachbarn auffällig macht).\nDanach entscheidest du je Beobachtung: grober Fehler (bleibt für Phase 1 außen vor) oder kein grober Fehler (wieder aufnehmen).\nVor Phase 2 fragt Klein_Method nach, ob die groben Fehler wieder aufgenommen oder deaktiviert gelassen werden.\nNur freie und fixe Ausgleichung. Auch in der Karte verfügbar.
k90892722=Solo activo si tras F5 se sospechan errores groseros: una observación se desvía linealmente en más de\nla «Límite de errores groseros (m)» (estándar 0,10 m) - entonces «Iniciar Klein_Method» queda bloqueado hasta que se depure.\nNi logPost ni ningún otro valor estadístico, solo la desviación lineal en metros.\n\nProcedimiento: la observación con la mayor desviación lineal se desactiva temporalmente y se recalcula, luego la siguiente -\nhasta que ninguna quede por encima del límite (paso a paso, porque un error grosero también puede hacer llamativos a vecinos sanos).\nDespués usted decide, observación por observación: error grosero (queda fuera para la fase 1) o no es error grosero (se vuelve a incluir).\nAntes de la fase 2, Klein_Method pregunta si los errores groseros se vuelven a incluir o se dejan desactivados.\nSolo ajuste libre y fijo. También disponible en el mapa.
