# de: Koordinatensystem der Exportdatei. Angeboten werden nur Systeme, die sich aus dem Projektsystem mit eindeutigen Formeln umformen lassen (gleiches Datum ETRS89/WGS84, GRS80) - keine Datumstransformation, kein Geoidmodell.\nLokal (ENh) mit P0: geozentrisch, B/L/h und UTM 32/33 mit ellipsoidischer Höhe.\nGeozentrisch: B/L/h, UTM 32/33 und lokal (ENh) um P0.\nUTM mit Zonenkennung: B/L und die andere Zone, Höhe unverändert.\nGauß-Krüger mit Streifenkennung: wie UTM, wenn im Projektionsordner eine NTv2-Gitterdatei für das Gebiet liegt, sonst nur das Projektsystem.\nJede Gitterdatei (*.gsb) im Projektionsordner stellt ihre Systeme automatisch bereit (geographisch und Gauß-Krüger-Streifen, als „Transformation NTv2“ gekennzeichnet); dazu kommen eindeutige Definitionen aus dem Ordner (reine Umformungen ETRS89). 7-Parameter-Sätze werden nicht angeboten.
kbfa811d7=Sistema de coordenadas del archivo de exportación. Solo se ofrecen sistemas que se derivan del sistema del proyecto con fórmulas unívocas (mismo datum ETRS89/WGS84, GRS80) - sin transformación de datum, sin modelo de geoide.\nLocal (ENh) con P0: geocéntrico, B/L/h y UTM 32/33 con altura elipsoidal.\nGeocéntrico: B/L/h, UTM 32/33 y local (ENh) alrededor de P0.\nUTM con número de zona: B/L y la otra zona, altura sin cambios.\nGauss-Krüger con número de franja: como UTM si la carpeta de proyecciones contiene un archivo de rejilla NTv2 para la zona; si no, solo el sistema del proyecto.\nCada archivo de rejilla (*.gsb) de la carpeta de proyecciones aporta automáticamente sus sistemas (geográfico y franjas Gauss-Krüger, marcados como „transformación NTv2“); además, las definiciones unívocas de la carpeta (conversiones puras ETRS89). No se ofrecen juegos de 7 parámetros.
