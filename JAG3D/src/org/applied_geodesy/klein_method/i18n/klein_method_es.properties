# de: Wirkt nur bei GNSS-Basislinien im Verteilungsmodus „prozentual“:\n1. „gedämpfter Achs Split“ (Empfehlung): Korrektur nach den Achsen X/Y/Z aufgeteilt (Anteil je Achse aus dem EP), gedämpft - im Vergleich stabil und zeigt die schwächere GNSS-Höhe.\n2. „Lage/Höhe-Split“: Korrektur nach Lage (horizontal) und Höhe (Lotrichtung) aufgeteilt, gedämpft; die Lotrichtung wird je Basislinie aus den ausgeglichenen Koordinaten bestimmt - am stabilsten, unterscheidet Höhe/Lage aber kaum.\n3. „einfache Anpassung“: sigma_neu = sigma_alt + sigma_alt*log10(F), alle Achsen gleich - am unruhigsten.\nIm Modus „normal“ gilt immer die einfache Anpassung.
kaf9504e2=Solo actúa en líneas base GNSS en modo de distribución «porcentual»:\n1. «reparto de ejes amortiguado» (recomendación): corrección repartida según los ejes X/Y/Z (proporción por eje a partir del EP), amortiguada - comparativamente estable y muestra la altura GNSS más débil.\n2. «reparto planimetría/altura»: corrección repartida según planimetría (horizontal) y altura (dirección de la plomada), amortiguada; la dirección de la plomada se determina por línea base a partir de las coordenadas ajustadas - la más estable, pero apenas distingue altura/planimetría.\n3. «ajuste simple»: sigma_neu = sigma_alt + sigma_alt*log10(F), igual para todos los ejes - la más inestable.\nEn modo «normal» siempre se aplica el ajuste simple.
