# de: Pendelt Max-logPost in der freien bzw. fixen Ausgleichung (Phase 2) sägezahnartig (in den letzten 4 Werten mindestens 2 Richtungswechsel),\nwird im Modus „normal“ nur die Hälfte des berechneten Schritts geschrieben: sigma_neu = sigma_alt + 0,5 · (sigma_formel − sigma_alt).\nGilt für GNSS im Modus „normal“ (auch während des Wächter-Wechsels) und für Richtungen, Strecken und Nivellement.\nVersuch – Standard aus. Wirkung im Protokoll: Zeile „DAEMPFUNG NORMAL“.
k3305e40a=Si Max-logPost oscila en diente de sierra en el ajuste libre o constreñido (fase 2) (al menos 2 cambios de sentido en los últimos 4 valores),\nen el modo «normal» solo se escribe la mitad del paso calculado: sigma_nuevo = sigma_anterior + 0,5 · (sigma_fórmula − sigma_anterior).\nSe aplica al GNSS en modo «normal» (también durante el cambio del vigilante) y a direcciones, distancias y nivelación.\nPrueba: desactivado por defecto. Efecto en el protocolo: línea «DAEMPFUNG NORMAL».
