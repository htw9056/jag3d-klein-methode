# de: Längenabhängiger Zuschlag zur Grenze grober Fehler für GNSS-Basislinien: Grenze = Grenze grober Fehler + ppm × Länge.\nBeispiel 0,100 m + 2 ppm: 10 km → 0,120 m, 40 km → 0,180 m. Lange SAPOS-Basislinien werden so nicht wegen normaler Troposphären- und Höheneffekte abgeschaltet.\nStandard 2,0, erlaubt 0 bis 20, 0 = feste Grenze.
k5a89f658=Suplemento dependiente de la longitud al límite de errores groseros para líneas base GNSS: límite = límite de errores groseros + ppm × longitud.\nEjemplo 0,100 m + 2 ppm: 10 km → 0,120 m, 40 km → 0,180 m. Así las líneas base SAPOS largas no se desactivan por efectos normales de troposfera y altura.\nPor defecto 2,0, permitido de 0 a 20, 0 = límite fijo.
