# de: Direkt aufeinanderfolgende Messungen desselben Standpunkts und Ziels (GNSS: Epochen einer Sitzung, Lasertracker: Messreihen auf einen Punkt) sind nicht unabhängig. Als einzelne Beobachtungen wiegen sie etwa Wurzel(n)-fach zu schwer und drängen die übrigen Messungen an den Rand.\n\nZusammenfassen: je Wiederholungsgruppe ein Mittel, die Einzelwerte werden deaktiviert (nicht gelöscht); Genauigkeit mindestens die Streuung der Gruppe.\nSprünge und Drift innerhalb einer Gruppe werden vorher geprüft. Rücknahme jederzeit über Menü Klein_Method.\n\n
k3e18b639=Las mediciones directamente consecutivas desde la misma estación al mismo objetivo (GNSS: épocas de una sesión, laser tracker: series sobre un punto) no son independientes. Como observaciones individuales pesan unas sqrt(n) veces de más y desplazan a las demás mediciones.\n\nFusionar: una media por grupo de repetición, los valores individuales se desactivan (no se borran); precisión al menos la dispersión del grupo.\nLos saltos y la deriva dentro de un grupo se comprueban antes. Deshacer en cualquier momento en el menú Klein_Method.\n\n
# de: Grenze grober Fehler als lineare Abweichung einer Beobachtung in Metern (Standard 0,10 m).\nEinziges Kriterium - kein logPost oder anderer statistischer Wert:\n• Sperre nach F5: liegt eine Beobachtung darüber, ist nur „Grobe Fehler bereinigen“ aktiv.\n• Bereinigung: nimmt schrittweise die größte Abweichung heraus, bis keine mehr darüber liegt.\n• Fenster: bis zu diesem Wert grün (hält die Ausgleichung aus, wieder aufnehmen), darüber rot (grober Fehler).\nLineare Abweichung = geschätzter grober Fehler aus JAG3D; Richtung/Zenitwinkel mal Strecke, GNSS als 3D-Länge.\nKaum kontrollierte Beobachtungen (Redundanzanteil unter 5 %) sind nicht prüfbar und zählen nicht mit.\nErlaubt: 
k3e3dc535=Límite de errores groseros como desviación lineal de una observación en metros (estándar 0,10 m).\nÚnico criterio - ni logPost ni ningún otro valor estadístico:\n• Bloqueo tras F5: si una observación está por encima, solo está activo «Depurar errores groseros».\n• Depuración: retira paso a paso la mayor desviación, hasta que ninguna quede por encima.\n• Ventana: hasta este valor en verde (soporta el ajuste, se puede volver a incluir), por encima en rojo (error grosero).\nDesviación lineal = error grosero estimado por JAG3D; dirección/ángulo cenital por distancia, GNSS como longitud 3D.\nLas observaciones apenas controladas (parte de redundancia por debajo del 5%) no se pueden comprobar y no cuentan.\nPermitido: 
