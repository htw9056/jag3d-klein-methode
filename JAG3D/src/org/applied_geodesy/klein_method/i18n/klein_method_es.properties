# de: Ein: je Punkt ein Messart-Symbol (Torte aus allen Messarten an diesem Punkt: GNSS violett, Strecke, Richtung, Zenitwinkel farbig) genau auf dem Punkt.\nAus (Standard): keine Messart-Symbole, nur Punkte und Linien.\nDer JAG3D-Netzplot zeichnet die Symbole ein Stück entlang jeder Linie; laufen viele Linien in dieselbe Richtung (z. B. zu fernen Referenzstationen), wirken sie dort wie eine verschobene Punktwolke - deshalb setzt die Karte sie auf den Punkt.\nNur Anzeige in der Karte - der Netzplot und seine Einstellungen bleiben unverändert.
k13d6ca9a=Activado: un símbolo de observación por punto (gráfico circular de todos los tipos de observación en ese punto: GNSS violeta, distancia, dirección, ángulo cenital en color) exactamente sobre el punto.\nDesactivado (por defecto): sin símbolos de observación, solo puntos y líneas.\nEl gráfico de red de JAG3D dibuja los símbolos un poco a lo largo de cada línea; si muchas líneas van en la misma dirección (p. ej. hacia estaciones de referencia lejanas), allí parecen una nube de puntos desplazada - por eso el mapa los coloca sobre el punto.\nSolo visualización en el mapa - el gráfico de red y su configuración no cambian.
