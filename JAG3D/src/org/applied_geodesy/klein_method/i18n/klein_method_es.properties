# de: Nur dynamische Ausgleichung: Welche beweglichen Anschlusspunkte können künftig als Festpunkte dienen?\nBewertet wird je Punkt die kalibrierte individuelle Unsicherheit (eine Zahl für y/x/z) in Ampelfarben:\nRandpunkte (Endbereiche, äußere Umrandung, Anschlussbereiche) mit den Rand-Grenzen, Stützpunkte in der Mitte mit den Mitte-Grenzen;\n1D-Punkte (Nivellement) jeweils mit der Höhen-, 2D/3D-Punkte mit der Lage-Grenze.\nDanach wird die Verteilung der grünen Festpunkte geprüft: langgestreckte Netze auf Lücken und Enden,\nflächige Netze darauf, dass alle Neupunkte innerhalb der Festpunkte liegen.\nEs ist eine Empfehlung - im Zweifel entscheidet der Anwender.
k6f607944=Solo ajuste dinámico: ¿qué puntos de enlace móviles pueden servir en el futuro como puntos de control?\nSe evalúa cada punto según su incertidumbre individual calibrada (un valor para y/x/z) con colores de semáforo:\npuntos de borde (zonas extremas, contorno exterior, zonas de enlace) con los límites de borde, puntos de apoyo en el centro con los límites del centro;\npuntos 1D (nivelación) con el límite de altura, puntos 2D/3D con el límite de posición.\nDespués se comprueba la distribución de los puntos de control verdes: en redes alargadas, huecos y extremos;\nen redes areales, que todos los puntos nuevos queden dentro de los puntos de control.\nEs una recomendación - en caso de duda decide el usuario.
