# de: Im Nivellement sind die Redundanzanteile klein - jeder Höhenunterschied ist kaum kontrolliert. EP ist dort durch die Netzform hoch und kein Hinweis auf einen Messfehler. Bewertet wird deshalb mit logPost.\nIn gemischten Netzen bewertet EP nur die übrigen Messarten, das Nivellement bleibt bei logPost.
kd2cc9f63=En la nivelación los números de redundancia son pequeños: cada desnivel apenas está controlado. Por eso el EP es alto debido a la geometría de la red y no indica un error de medición. Por ello se evalúa con logPost.\nEn redes mixtas el EP evalúa solo los demás tipos de observación; la nivelación sigue con logPost.
