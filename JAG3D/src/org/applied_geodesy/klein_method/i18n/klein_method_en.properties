# de: Liegt Max-logPost beim Erreichen der Abbruchgrenze ab DL 2 noch über dem logPost-Grenzwert, rechnet Phase 2 weiter\nin Richtung Grenzwert. Der jeweils beste Stand (Unsicherheiten, Gruppenwerte, aktive Beobachtungen, Zusatzparameter)\nwird im Projekt gesichert. Wird der Grenzwert nicht erreicht, wird der beste Stand zurückgeschrieben und noch einmal\nausgeglichen; der Lauf endet mit Vermerk und zählt nicht für das Schwarmwissen.\nLag Max-logPost schon in Durchlauf 1 unter dem Grenzwert, wird auch dieser Stand gesichert und übernommen,\nwenn die weiteren Durchläufe den Grenzwert nicht erreichen (dann gilt der Lauf als kalibriert).\nHöchstzahl der Nachlauf-Iterationen. Standard 30, erlaubt 1 bis 200, 0 = Nachlauf und Sicherung aus.
kceead933=If Max-logPost is still above the logPost threshold when the termination threshold from run 2 is reached, phase 2 continues\ntowards the threshold. The best state so far (uncertainties, group values, active observations, additional parameters)\nis saved in the project. If the threshold is not reached, the best state is written back and adjusted once more;\nthe run ends with a note and does not count for the swarm knowledge.\nIf Max-logPost was already below the threshold in run 1, that state is saved as well and applied\nif the later runs do not reach the threshold (the run then counts as calibrated).\nMaximum number of follow-up iterations. Default 30, allowed 1 to 200, 0 = follow-up and backup off.
# de: Kaum kontrolliert (Redundanzanteil unter %d %%) - ein grober Fehler wäre dort nicht erkennbar, bitte im Feld absichern (zusätzliche Messung): %d Beobachtungen, z. B.\n%s
