# de: Wirkt nur bei GNSS-Basislinien im Verteilungsmodus „prozentual“:\n1. „gedämpfter Achs Split“ (Empfehlung): Korrektur nach den Achsen X/Y/Z aufgeteilt (Anteil je Achse aus dem EP), gedämpft - im Vergleich stabil und zeigt die schwächere GNSS-Höhe.\n2. „Lage/Höhe-Split“: Korrektur nach Lage (horizontal) und Höhe (Lotrichtung) aufgeteilt, gedämpft; die Lotrichtung wird je Basislinie aus den ausgeglichenen Koordinaten bestimmt - am stabilsten, unterscheidet Höhe/Lage aber kaum.\n3. „einfache Anpassung“: sigma_neu = sigma_alt + sigma_alt*log10(F), alle Achsen gleich - am unruhigsten.\nIm Modus „normal“ gilt immer die einfache Anpassung.
kaf9504e2=Only effective for GNSS baselines in „percentage“ distribution mode:\n1. „damped axis split“ (recommended): correction split by the X/Y/Z axes (share per axis from the EP), damped - comparatively stable and shows the weaker GNSS height.\n2. „position/height split“: correction split by position (horizontal) and height (plumb-line direction), damped; the plumb-line direction is determined per baseline from the adjusted coordinates - the most stable, but barely distinguishes height/position.\n3. „simple adjustment“: sigma_neu = sigma_alt + sigma_alt*log10(F), all axes equal - the most volatile.\nIn „normal“ mode, the simple adjustment always applies.
