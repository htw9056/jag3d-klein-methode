k6f607944=Dynamic adjustment only: which movable connection points can serve as control points in the future?\nFor each point, the calibrated individual uncertainty (one value for y/x/z) is rated in traffic-light colours:\nedge points (end zones, outer outline, connection areas) with the edge limits, support points in the middle with the middle limits;\n1D points (levelling) with the height limit, 2D/3D points with the position limit.\nThen the distribution of the green control points is checked: elongated networks for gaps and ends,\nareal networks for whether all new points lie within the control points.\nIt is a recommendation - in case of doubt, the user decides.
