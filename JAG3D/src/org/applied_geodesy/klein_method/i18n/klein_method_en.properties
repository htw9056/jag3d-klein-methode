# de: Genauer als dieser Wert wird ein Festpunkt (beweglicher Anschlusspunkt) in der dynamischen AGL nicht angesetzt.\nIst ein Festpunkt mit den vorhandenen Messungen nicht prüfbar, würde seine Genauigkeit sonst bis fast null sinken:\ner wäre praktisch starr, und die Messungen (z. B. GNSS-Basislinien) hätten keinen Einfluss mehr auf ihn.\nLiegt ein Festpunkt am Ende an dieser Untergrenze, steht ein Hinweis im Protokoll.\nGilt nur, wenn das Projekt aktive GNSS-Basislinien hat - ohne GNSS gilt 0,01 mm (Lage und Höhe).\nStandard 1,0 mm, erlaubt 0,01 bis 50 mm.
kcf7f6922=A fixed point (movable connection point) is never given a better accuracy than this value in the dynamic adjustment.\nIf a fixed point cannot be checked with the available measurements, its accuracy would otherwise drop almost to zero:\nit would be practically rigid, and the measurements (e.g. GNSS baselines) would no longer have any influence on it.\nIf a fixed point ends at this lower limit, a note is written to the protocol.\nApplies only if the project has active GNSS baselines - without GNSS 0.01 mm applies (position and height).\nDefault 1.0 mm, allowed 0.01 to 50 mm.
# de: Schreibt den Kalibrierungsnachweis mit dem aktuellen Stand als Textdatei in den Protokollordner:\nje Beobachtungstyp, Gruppe und Komponente Start- und Endwert, VKS, Band, Redundanz, Anzahl und Status,\ndazu robuste VKS, Plausibilität gegen Datenblattwerte und Modellprüfung a/c.\nNach jedem Automatik-Lauf der freien/fixen Ausgleichung wird er automatisch geschrieben (dann mit Startwerten).
kcf924f79=Writes the calibration certificate with the current state as a text file to the log folder:\nper observation type, group and component start and end value, VKS, band, redundancy, count and status,\nplus robust VKS, plausibility against datasheet values and model check a/c.\nAfter every automatic run of the free/fixed adjustment it is written automatically (then with start values).
