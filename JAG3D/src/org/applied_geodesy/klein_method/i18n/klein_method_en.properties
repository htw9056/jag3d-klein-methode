# de: Im Nivellement sind die Redundanzanteile klein - jeder Höhenunterschied ist kaum kontrolliert. EP ist dort durch die Netzform hoch und kein Hinweis auf einen Messfehler. Bewertet wird deshalb mit logPost.\nIn gemischten Netzen bewertet EP nur die übrigen Messarten, das Nivellement bleibt bei logPost.
kd2cc9f63=In levelling the redundancy numbers are small - each height difference is hardly controlled. EP is therefore high because of the network geometry and does not indicate a measurement error. Evaluation therefore uses logPost.\nIn mixed networks EP evaluates only the other observation types; levelling stays with logPost.
