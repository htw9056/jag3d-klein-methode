k3305e40a=Se o Max-logPost oscilar em dente de serra no ajustamento livre ou fixo (Fase 2) (pelo menos 2 mudanças de direção nos últimos 4 valores),\nno modo «normal» só é escrita metade do passo calculado: sigma_novo = sigma_antigo + 0,5 · (sigma_fórmula − sigma_antigo).\nAplica-se ao GNSS no modo «normal» (também durante a mudança do vigilante) e a direções, distâncias e nivelamento.\nEnsaio – desligado por predefinição. Efeito no protocolo: linha «DAEMPFUNG NORMAL».
