# de: Liegt Max-logPost beim Erreichen der Abbruchgrenze ab DL 2 noch über dem logPost-Grenzwert, rechnet Phase 2 weiter\nin Richtung Grenzwert. Der jeweils beste Stand (Unsicherheiten, Gruppenwerte, aktive Beobachtungen, Zusatzparameter)\nwird im Projekt gesichert. Wird der Grenzwert nicht erreicht, wird der beste Stand zurückgeschrieben und noch einmal\nausgeglichen; der Lauf endet mit Vermerk und zählt nicht für das Schwarmwissen.\nLag Max-logPost schon in Durchlauf 1 unter dem Grenzwert, wird auch dieser Stand gesichert und übernommen,\nwenn die weiteren Durchläufe den Grenzwert nicht erreichen (dann gilt der Lauf als kalibriert).\nHöchstzahl der Nachlauf-Iterationen. Standard 30, erlaubt 1 bis 200, 0 = Nachlauf und Sicherung aus.
kceead933=Se o Max-logPost ainda estiver acima do limite logPost quando o limite de paragem a partir de EX 2 for atingido, a fase 2 continua\nem direção ao limite. O melhor estado obtido (incertezas, valores de grupo, observações ativas, parâmetros adicionais)\né guardado no projeto. Se o limite não for atingido, o melhor estado é reescrito e ajustado mais uma vez;\na execução termina com uma nota e não conta para o conhecimento coletivo.\nSe o Max-logPost já estava abaixo do limite na execução 1, esse estado também é guardado e adotado\nse as execuções seguintes não atingirem o limite (a execução conta então como calibrada).\nNúmero máximo de iterações de prolongamento. Predefinição 30, permitido 1 a 200, 0 = prolongamento e cópia desligados.
