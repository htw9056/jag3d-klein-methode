# de: Genauer als dieser Wert wird ein Festpunkt (beweglicher Anschlusspunkt) in der dynamischen AGL nicht angesetzt.\nIst ein Festpunkt mit den vorhandenen Messungen nicht prüfbar, würde seine Genauigkeit sonst bis fast null sinken:\ner wäre praktisch starr, und die Messungen (z. B. GNSS-Basislinien) hätten keinen Einfluss mehr auf ihn.\nLiegt ein Festpunkt am Ende an dieser Untergrenze, steht ein Hinweis im Protokoll.\nGilt nur, wenn das Projekt aktive GNSS-Basislinien hat - ohne GNSS gilt 0,01 mm (Lage und Höhe).\nStandard 1,0 mm, erlaubt 0,01 bis 50 mm.
kcf7f6922=No ajustamento dinâmico, um ponto fixo (ponto de ligação móvel) nunca recebe uma precisão melhor do que este valor.\nSe um ponto fixo não puder ser verificado com as medições disponíveis, a sua precisão desceria caso contrário quase a zero:\nficaria praticamente rígido e as medições (p. ex. linhas de base GNSS) deixariam de ter influência sobre ele.\nSe um ponto fixo terminar neste limite inferior, é escrita uma nota no protocolo.\nAplica-se apenas se o projeto tiver linhas de base GNSS ativas - sem GNSS aplica-se 0,01 mm (posição e altura).\nPredefinição 1,0 mm, permitido de 0,01 a 50 mm.
