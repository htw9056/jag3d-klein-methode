# de: Nur dynamische Ausgleichung: zeigt die Festpunkt-Empfehlung in der Karte.\nBewegliche Anschlusspunkte als Ring in Ampelfarbe (grün / gelb / rot, blau = bereits Festpunkt) mit ihrer Unsicherheit,\nbei langgestreckten Netzen die Achse (blau gestrichelt), bei flächigen die Umrandung der grünen Festpunkte,\nNeupunkte außerhalb der Festpunkte als rotes Kreuz. Ergebnis unten links.\nGrenzen und Abstände werden im Klein_Method-Tab eingestellt. Erneut klicken = ausblenden.
