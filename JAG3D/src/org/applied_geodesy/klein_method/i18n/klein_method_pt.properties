# de: Koordinatensystem der Exportdatei. Angeboten werden nur Systeme, die sich aus dem Projektsystem mit eindeutigen Formeln umformen lassen (gleiches Datum ETRS89/WGS84, GRS80) - keine Datumstransformation, kein Geoidmodell.\nLokal (ENh) mit P0: geozentrisch, B/L/h und UTM 32/33 mit ellipsoidischer Höhe.\nGeozentrisch: B/L/h, UTM 32/33 und lokal (ENh) um P0.\nUTM mit Zonenkennung: B/L und die andere Zone, Höhe unverändert.\nGauß-Krüger mit Streifenkennung: wie UTM, wenn im Projektionsordner eine NTv2-Gitterdatei für das Gebiet liegt, sonst nur das Projektsystem.\nJede Gitterdatei (*.gsb) im Projektionsordner stellt ihre Systeme automatisch bereit (geographisch und Gauß-Krüger-Streifen, als „Transformation NTv2“ gekennzeichnet); dazu kommen eindeutige Definitionen aus dem Ordner (reine Umformungen ETRS89). 7-Parameter-Sätze werden nicht angeboten.
kbfa811d7=Sistema de coordenadas do ficheiro de exportação. Só são oferecidos sistemas que se derivam do sistema do projeto com fórmulas inequívocas (mesmo datum ETRS89/WGS84, GRS80) - sem transformação de datum, sem modelo de geoide.\nLocal (ENh) com P0: geocêntrico, B/L/h e UTM 32/33 com altura elipsoidal.\nGeocêntrico: B/L/h, UTM 32/33 e local (ENh) em torno de P0.\nUTM com número de zona: B/L e a outra zona, altura inalterada.\nGauss-Krüger com número de faixa: como UTM se a pasta de projeções contiver um ficheiro de grelha NTv2 para a área; caso contrário, apenas o sistema do projeto.\nCada ficheiro de grelha (*.gsb) na pasta de projeções disponibiliza automaticamente os seus sistemas (geográfico e faixas Gauss-Krüger, marcados como „transformação NTv2“); além disso, as definições inequívocas da pasta (conversões puras ETRS89). Conjuntos de 7 parâmetros não são oferecidos.
