# de: Ein: je Punkt ein Messart-Symbol (Torte aus allen Messarten an diesem Punkt: GNSS violett, Strecke, Richtung, Zenitwinkel farbig) genau auf dem Punkt.\nAus (Standard): keine Messart-Symbole, nur Punkte und Linien.\nDer JAG3D-Netzplot zeichnet die Symbole ein Stück entlang jeder Linie; laufen viele Linien in dieselbe Richtung (z. B. zu fernen Referenzstationen), wirken sie dort wie eine verschobene Punktwolke - deshalb setzt die Karte sie auf den Punkt.\nNur Anzeige in der Karte - der Netzplot und seine Einstellungen bleiben unverändert.
k13d6ca9a=Ligado: um símbolo de observação por ponto (gráfico circular de todos os tipos de observação nesse ponto: GNSS violeta, distância, direção, ângulo zenital a cores) exatamente sobre o ponto.\nDesligado (predefinido): sem símbolos de observação, só pontos e linhas.\nO gráfico de rede do JAG3D desenha os símbolos um pouco ao longo de cada linha; se muitas linhas seguem na mesma direção (p. ex. para estações de referência distantes), parecem aí uma nuvem de pontos deslocada - por isso o mapa coloca-os sobre o ponto.\nApenas visualização no mapa - o gráfico de rede e as suas definições ficam inalterados.
