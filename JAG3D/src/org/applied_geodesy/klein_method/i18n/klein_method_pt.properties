# de: Nur dynamische Ausgleichung: Welche beweglichen Anschlusspunkte können künftig als Festpunkte dienen?\nBewertet wird je Punkt die kalibrierte individuelle Unsicherheit (eine Zahl für y/x/z) in Ampelfarben:\nRandpunkte (Endbereiche, äußere Umrandung, Anschlussbereiche) mit den Rand-Grenzen, Stützpunkte in der Mitte mit den Mitte-Grenzen;\n1D-Punkte (Nivellement) jeweils mit der Höhen-, 2D/3D-Punkte mit der Lage-Grenze.\nDanach wird die Verteilung der grünen Festpunkte geprüft: langgestreckte Netze auf Lücken und Enden,\nflächige Netze darauf, dass alle Neupunkte innerhalb der Festpunkte liegen.\nEs ist eine Empfehlung - im Zweifel entscheidet der Anwender.
k6f607944=Apenas ajustamento dinâmico: que pontos de ligação móveis podem servir futuramente como pontos de controlo?\nCada ponto é avaliado pela sua incerteza individual calibrada (um valor para y/x/z) em cores de semáforo:\npontos de bordo (zonas de extremo, contorno exterior, zonas de ligação) com os limites de bordo, pontos de apoio no meio com os limites do meio;\npontos 1D (nivelamento) com o limite de altura, pontos 2D/3D com o limite de posição.\nDepois verifica-se a distribuição dos pontos de controlo verdes: em redes alongadas, lacunas e extremos;\nem redes areais, se todos os pontos novos ficam dentro dos pontos de controlo.\nÉ uma recomendação - em caso de dúvida decide o utilizador.
