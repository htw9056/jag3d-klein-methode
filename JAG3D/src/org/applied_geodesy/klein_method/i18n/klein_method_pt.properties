# de: Schreibt Erfahrungswerte als Gruppenunsicherheit (Startwerte für Phase 1) - erst nach Vorschau und „Übernehmen“.\nDynamische Ausgleichung: Startwert je Dimension für alle beweglichen Anschlusspunkte (nur gleiche Festpunktart).\nNur Werte aus ANDEREN Projekten, die sich untereinander höchstens 10 % unterscheiden (Gruppe um den Median, mindestens 3 Projekte).\nAbweichende Projekte werden weggelassen und in der Vorschau genannt; ohne passende Gruppe bleibt der Wert unverändert.\nDeaktivierte Komponenten (0) bleiben 0, Untergrenzen werden eingehalten. Danach wird das Netz neu ausgeglichen.
k24af24c7=Escreve os valores empíricos como incerteza de grupo (valores iniciais para a Fase 1) - só depois de pré-visualizar e „Aplicar“.\nAjustamento dinâmico: valor inicial por dimensão para todos os pontos de ligação móveis (apenas do mesmo tipo de ponto de controlo).\nApenas valores de OUTROS projetos que difiram entre si no máximo 10 % (grupo em torno da mediana, mínimo 3 projetos).\nProjetos divergentes são excluídos e mencionados na pré-visualização; sem grupo correspondente, o valor permanece inalterado.\nComponentes desativadas (0) permanecem 0, os limites mínimos são respeitados. Depois a rede é reajustada.
