kc98ae8e1=Deteta muitíssimas linhas de base GNSS (p. ex. épocas a cada 1-5 s durante 30 min para várias estações SAPOS): mais de 20 000 ou em média pelo menos 20 por par de pontos.\nLigado (predefinido): antes do primeiro cálculo, uma média robusta por par de pontos - mediana, épocas acima de 3 dispersões são rejeitadas, precisão não dividida por raiz(n); valores individuais desativados, anulação a qualquer momento.\nDesligado: o ajustamento fica bloqueado com mais de 20 000 linhas de base ativas até ser escolhido «Reduzir agora» no assistente de fluxo.
