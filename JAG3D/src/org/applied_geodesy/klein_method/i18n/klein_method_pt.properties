# de: Im Nivellement sind die Redundanzanteile klein - jeder Höhenunterschied ist kaum kontrolliert. EP ist dort durch die Netzform hoch und kein Hinweis auf einen Messfehler. Bewertet wird deshalb mit logPost.\nIn gemischten Netzen bewertet EP nur die übrigen Messarten, das Nivellement bleibt bei logPost.
kd2cc9f63=No nivelamento as partes de redundância são pequenas - cada desnível é pouco controlado. Por isso o EP é alto devido à geometria da rede e não indica um erro de medição. A avaliação é, por isso, feita com logPost.\nEm redes mistas o EP avalia apenas os outros tipos de observação; o nivelamento fica com logPost.
