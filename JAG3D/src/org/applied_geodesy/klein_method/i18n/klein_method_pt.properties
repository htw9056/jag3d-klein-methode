# de: Unterhalb dieser Redundanz einer Komponente (a/b/c eines Beobachtungstyps) wird das VKS-Band um √(Wert/Redundanz) aufgeweitet,\nhöchstens auf 0,900-1,100. Wenige überschüssige Beobachtungen tragen eine enge Kalibrierung statistisch nicht -\nso wird das Rauschen weniger Beobachtungen nicht „wegkalibriert“ und es gibt weniger Schleifen ohne Nutzen.\nStandard 100, erlaubt 5 bis 100 000, 0 = aus (festes Band für alle).
