# de: Beschleunigt die Einzelkalibrierung der Festpunkte (dynamische AGL, Phase 2), sobald die Hälfte fertig ist.\nNur beim Verkleinern. Bei Richtungswechsel 5 Schritte Pause, beim 2. Wechsel aus.\nSteht T_prio eines Punkts unter dem Band dreimal in Folge fast still, obwohl sigma verkleinert wird,\ngeht der Punkt direkt auf die Untergrenze – das gilt sofort, nicht erst ab der Hälfte.\nPhase 1 (Punktgruppen) rechnet immer ohne Turbo.
k3c2a51b4=Acelera a calibração individual dos pontos de controlo (AGL dinâmico, Fase 2), assim que metade estiver concluída.\nApenas ao reduzir. Ao mudar de direção, 5 passos de pausa; à 2.ª mudança, desliga.\nSe o T_prio de um ponto abaixo da banda quase não mudar três vezes seguidas, embora sigma seja reduzido,\no ponto passa diretamente para o limite inferior – isto aplica-se de imediato, não só a partir de metade.\nA Fase 1 (grupos de pontos) calcula sempre sem turbo.
