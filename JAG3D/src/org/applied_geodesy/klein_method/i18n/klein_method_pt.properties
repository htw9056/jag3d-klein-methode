k48ba4437=No início da calibração a VKS é calculada também de forma robusta (mediana) por tipo de observação. Se a VKS normal\nfor maior do que a robusta em mais do que este fator, provavelmente há um erro grosseiro não detetado no tipo:\njanela de aviso (a automática continua), protocolo e certificado de calibração.\nPadrão 2,0, permitido de 1,2 a 10, 0 = desligado.
