# de: Nur dynamische und fixe AGL. Ein: Die 3D-Fest- bzw. Anschlusspunkte (GNSS, Tachymeter) bestimmen nur noch die Lage, ihre Höhe ist frei (σz = 10 m). Die Höhe kommt ausschließlich aus den Höhenfestpunkten (1D) über das Nivellement.\nDynamische AGL: die Festpunktanalyse bewertet bei 3D-Punkten nur die Lage. Fixe AGL: die varianzfreien 3D-Festpunkte kommen in eine eigene Gruppe, die in der Lage praktisch fest ist (σ 0,01 mm).\nVoraussetzung: Höhenfestpunkte im selben Höhensystem (NHN vorher mit dem Quasigeoid umrechnen), über Nivellement verbunden, empfohlen mindestens 3; in der fixen AGL mindestens einer varianzfrei.\nAus: alle Werte exakt wie vorher.
k14563907=Apenas ajustamento dinâmico e fixo. Ligado: os pontos fixos/de ligação 3D (GNSS, estação total) definem apenas a posição, a sua altura fica livre (σz = 10 m). A altura vem exclusivamente das marcas de nivelamento (1D) através do nivelamento.\nAjustamento dinâmico: a análise de pontos fixos avalia apenas a posição dos pontos 3D. Ajustamento fixo: os pontos fixos 3D sem variância passam para um grupo próprio, praticamente fixo em posição (σ 0,01 mm).\nRequisito: marcas no mesmo sistema de altitudes (converter antes NHN com o quase-geoide), ligadas por nivelamento, recomendadas pelo menos 3; no ajustamento fixo pelo menos uma sem variância.\nDesligado: todos os valores exatamente como antes.
