# de: Direkt aufeinanderfolgende Messungen desselben Standpunkts und Ziels (GNSS: Epochen einer Sitzung, Lasertracker: Messreihen auf einen Punkt) sind nicht unabhängig. Als einzelne Beobachtungen wiegen sie etwa Wurzel(n)-fach zu schwer und drängen die übrigen Messungen an den Rand.\n\nZusammenfassen: je Wiederholungsgruppe ein Mittel, die Einzelwerte werden deaktiviert (nicht gelöscht); Genauigkeit mindestens die Streuung der Gruppe.\nSprünge und Drift innerhalb einer Gruppe werden vorher geprüft. Rücknahme jederzeit über Menü Klein_Method.\n\n
k3e18b639=Medições diretamente consecutivas da mesma estação para o mesmo alvo (GNSS: épocas de uma sessão, laser tracker: séries sobre um ponto) não são independentes. Como observações individuais pesam cerca de sqrt(n) vezes demais e empurram as outras medições para o lado.\n\nFundir: uma média por grupo de repetição, os valores individuais são desativados (não apagados); precisão pelo menos a dispersão do grupo.\nSaltos e deriva dentro de um grupo são verificados antes. Anulação a qualquer momento no menu Klein_Method.\n\n
# de: Grenze grober Fehler als lineare Abweichung einer Beobachtung in Metern (Standard 0,10 m).\nEinziges Kriterium - kein logPost oder anderer statistischer Wert:\n• Sperre nach F5: liegt eine Beobachtung darüber, ist nur „Grobe Fehler bereinigen“ aktiv.\n• Bereinigung: nimmt schrittweise die größte Abweichung heraus, bis keine mehr darüber liegt.\n• Fenster: bis zu diesem Wert grün (hält die Ausgleichung aus, wieder aufnehmen), darüber rot (grober Fehler).\nLineare Abweichung = geschätzter grober Fehler aus JAG3D; Richtung/Zenitwinkel mal Strecke, GNSS als 3D-Länge.\nKaum kontrollierte Beobachtungen (Redundanzanteil unter 5 %) sind nicht prüfbar und zählen nicht mit.\nErlaubt: 
k3e3dc535=Limite de erro grosseiro como desvio linear de uma observação em metros (padrão 0,10 m).\nÚnico critério - não é o logPost nem outro valor estatístico:\n• Bloqueio após F5: se uma observação estiver acima, só „Eliminar erros grosseiros“ está ativo.\n• Depuração: retira passo a passo o maior desvio, até nenhum estar acima.\n• Janela: até este valor verde (a observação aguenta o ajustamento, é reativada), acima vermelho (erro grosseiro).\nDesvio linear = erro grosseiro estimado a partir do JAG3D; direção/ângulo zenital vezes distância, GNSS como comprimento 3D.\nObservações pouco controladas (número de redundância abaixo de 5 %) não são verificáveis e não contam.\nPermitido: 
