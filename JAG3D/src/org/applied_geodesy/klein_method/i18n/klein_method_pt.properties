# de: Wirkt nur bei GNSS-Basislinien im Verteilungsmodus „prozentual“:\n1. „gedämpfter Achs Split“ (Empfehlung): Korrektur nach den Achsen X/Y/Z aufgeteilt (Anteil je Achse aus dem EP), gedämpft - im Vergleich stabil und zeigt die schwächere GNSS-Höhe.\n2. „Lage/Höhe-Split“: Korrektur nach Lage (horizontal) und Höhe (Lotrichtung) aufgeteilt, gedämpft; die Lotrichtung wird je Basislinie aus den ausgeglichenen Koordinaten bestimmt - am stabilsten, unterscheidet Höhe/Lage aber kaum.\n3. „einfache Anpassung“: sigma_neu = sigma_alt + sigma_alt*log10(F), alle Achsen gleich - am unruhigsten.\nIm Modus „normal“ gilt immer die einfache Anpassung.
kaf9504e2=Atua apenas em linhas de base GNSS no modo de distribuição „percentual“:\n1. „divisão de eixos amortecida“ (recomendação): correção repartida pelos eixos X/Y/Z (parcela por eixo a partir do EP), amortecida - comparativamente estável e evidencia a altura GNSS mais fraca.\n2. „divisão posição/altura“: correção repartida por posição (horizontal) e altura (direção da vertical), amortecida; a direção da vertical é determinada por linha de base a partir das coordenadas ajustadas - a mais estável, mas quase não distingue altura/posição.\n3. „ajuste simples“: sigma_neu = sigma_alt + sigma_alt*log10(F), todos os eixos iguais - a mais instável.\nNo modo „normal“ aplica-se sempre o ajuste simples.
