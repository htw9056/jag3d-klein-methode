# de: V0.353:\nDurchlauf 1 endet bei Max-logPost unter 2,45. Ist „Untergrenze erzwingen“ und/oder „Gruppen-σ nach DL 1“ eingeschaltet, werden die Werte dort zurückgesetzt und Durchlauf 2 startet.\nAb Durchlauf 2 beendet Max-logPost unter der „Abbruchgrenze ab DL 2“ (Standard 5,2) bzw. unter 2,45 die Berechnung (ohne weitere Untergrenzen-Erzwingung).\nEndet ein Durchlauf am Grenzwert Iterationen ohne 2,45, startet der nächste.\nAbbruchziel: Durchlauf 3 = bester Max-logPost aus Durchlauf 2 (nur unter 5,2), ab Durchlauf 4 = 5,2. Maximal 20 Durchläufe.
k7d40cde9=V0.353:\nA execução 1 termina quando Max-logPost fica abaixo de 2,45. Se „Impor limite mínimo“ e/ou „σ do grupo após EX 1“ estiverem ativados, os valores são repostos nesse ponto e a execução 2 começa.\nA partir da execução 2, o cálculo termina quando Max-logPost fica abaixo do „Limite de paragem a partir de EX 2“ (padrão 5,2) ou abaixo de 2,45 (sem mais imposição de limite mínimo).\nSe uma execução terminar no limite de iterações sem atingir 2,45, a próxima começa.\nMeta de paragem: execução 3 = melhor Max-logPost da execução 2 (só abaixo de 5,2), a partir da execução 4 = 5,2. Máximo de 20 execuções.
