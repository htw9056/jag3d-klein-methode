kb4401ec6=Ligado (por defeito): valores iniciais de altura primeiro do nivelamento, depois de alturas trigonométricas, alturas GNSS apenas\npara pontos que de outro modo não obtêm altura; valores iniciais de posição primeiro terrestres, depois GNSS.\nEm altura, sessões GNSS repetidas entre os mesmos pontos contam juntas como uma linha de base,\ne a altura GNSS recebe 3 vezes a incerteza de posição - assim muitas sessões não se sobrepõem às alturas terrestres.\nDesligado: todos os tipos de observação iguais (como até V0.417).
