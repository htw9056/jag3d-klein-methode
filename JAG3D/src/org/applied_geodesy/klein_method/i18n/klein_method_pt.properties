# de: Schrittweise wurde die auffälligste Beobachtung (größte Teststatistik unter denen über der Grenze) vorübergehend herausgenommen und neu gerechnet, bis keine mehr über der Grenze liegt (Reihenfolge = Entdeckung). Ein grober Fehler macht oft auch gesunde Nachbarn auffällig - deshalb schrittweise. In einem Schritt gemeinsam herausgenommen werden: bei Häufung an einem Punkt (mindestens 5 und 80 %) die stärksten davon; sonst bis zu 10 voneinander unabhängige Ausreißer ohne gemeinsamen Punkt. Eine Gegenprobe am Ende nimmt Beobachtungen wieder auf, die danach unter der Grenze liegen.\n\nAngehakt = grober Fehler: bleibt für Phase 1 (Gruppenkalibrierung) außen vor (in JAG3D vorübergehend deaktiviert). Vor Phase 2 fragt Klein_Method nach, was damit geschehen soll.\nNicht angehakt = kein grober Fehler: wird sofort wieder aufgenommen und nicht mehr gemeldet.
k38f71059=Passo a passo, a observação mais suspeita (maior estatística de teste entre as que excedem o limite) foi retirada temporariamente e recalculada até nenhuma exceder o limite (ordem = deteção). Um erro grosseiro torna muitas vezes suspeitas também vizinhas sãs - daí o passo a passo. Retiradas em conjunto num passo: com concentração num ponto (pelo menos 5 e 80 %) as mais fortes; caso contrário, até 10 valores atípicos independentes sem ponto comum. Uma verificação final volta a incluir as observações que depois ficam abaixo do limite.\n\nMarcada = erro grosseiro: fica excluída na fase 1 (calibração por grupos) (desativada temporariamente no JAG3D). Antes da fase 2, o Klein_Method pergunta o que fazer.\nNão marcada = sem erro grosseiro: é reincluída de imediato e deixa de ser assinalada.
