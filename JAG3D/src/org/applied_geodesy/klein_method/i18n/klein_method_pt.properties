# de: Nach fertiger Automatik: Liegt der Varianzfaktor einer Messart unter dem VKS-Band, weil Untergrenzen ihre Genauigkeiten festhalten (Genauigkeiten zu pessimistisch), werden alle Genauigkeiten dieser Messart mit Wurzel(Faktor) verkleinert und neu ausgeglichen - höchstens 3 Runden, je Runde höchstens halbiert. Log und Protokoll: SCHLUSSANGLEICHUNG VKS.
